name: Verify Stage 5 exact provider

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'query/exact-engine.mjs'
      - 'query/provider-precomputed.mjs'
      - 'query/test/provider-exact-fallback.test.mjs'
      - 'prototype/src/pastafarian_year_batch.cpp'
      - 'prototype/src/sauce_fast127_v12.hpp'
      - 'prototype/src/short_selection_o1.hpp'
      - 'prototype/src/seer_year_locator.cpp'
      - 'prototype/tools/short_selection_o1_test.cpp'
      - 'prototype/scripts/check_short_selection_o1.sh'
      - 'prototype/scripts/build_year_locator.sh'
      - 'http/**'
      - 'api/**'
      - '.github/workflows/verify-stage5-exact-provider.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgmp-dev libboost-dev

      - name: Build exact engines
        run: |
          bash prototype/scripts/build_year_batch.sh
          bash prototype/scripts/build_year_locator.sh

      - name: Verify O(1) short-selection lemma and production paths
        run: bash prototype/scripts/check_short_selection_o1.sh

      - name: Pathological short-selection exact regressions
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { performance } from 'node:perf_hooks';
          import { createExactEngine } from './query/exact-engine.mjs';
          const root = process.cwd();
          const engine = createExactEngine({
            generatedDir: path.join(root, 'generated'),
            yearBatchBinary: path.join(root, 'prototype', 'build', 'seer_year_batch'),
            yearLocatorBinary: path.join(root, 'prototype', 'build', 'seer_year_locator'),
            dataDir: path.join(root, 'prototype', 'data'),
            timeoutMs: 120000,
          });
          const witnesses = [2448569,2448683,2448806,2448900,2448959,2449014,2449020,2449085,2449291,2449570,2449659,2449670,2449680,2449765,2449904,2450030];
          for (const calc of witnesses) {
            const started = performance.now();
            const result = await engine.query({ calculationJdn: BigInt(calc), targetJdn: BigInt(calc) });
            if (result.record.targetJdn !== calc) throw new Error(`target mismatch for ${calc}`);
            console.log(JSON.stringify({ calcJdn: calc, elapsedMs: Math.round(performance.now() - started) }));
          }
          NODE

      - name: Syntax checks
        run: |
          node --check query/exact-engine.mjs
          node --check query/provider-precomputed.mjs
          node --check http/app.mjs
          node --check http/server.mjs

      - name: Node tests
        run: node --test precompute/test/*.test.mjs query/test/*.test.mjs http/test/*.test.mjs
      - name: Set up isolated contract environment
        run: |
          python -m venv .contract-venv
          .contract-venv/bin/python -m pip install --disable-pip-version-check \
            'jsonschema>=4.18,<5' 'referencing>=0.30' 'jsonschema-specifications>=2023.3.6' PyYAML

      - name: Contract tests
        run: .contract-venv/bin/python api/tests/test_contract.py

      - name: Exact fallback smoke
        run: |
          node --input-type=module <<'NODE'
          import { queryDate, queryYear } from './query/index.mjs';
          const calc = 2461303;
          const outsideCache = 2461676;
          const date = await queryDate({
            calculation: { jdn: String(calc) },
            target: { jdn: String(outsideCache) },
            presentation: 'canonical',
          });
          if (date.targetDay.jdn !== String(outsideCache)) throw new Error('exact fallback target mismatch');
          const year = await queryYear('5000', {
            calculation: { jdn: String(calc) },
            presentation: 'canonical',
          });
          if (year.year.number !== '5000' || year.year.lengthDays < 1) throw new Error('year structure smoke failed');
          console.log(JSON.stringify({ exactTarget: date.targetDay.jdn, yearLength: year.year.lengthDays }));
          NODE

name: CSP H200 native pair service (research preflight)
on:
  pull_request:
    paths:
      - 'prototype/src/seer_engine_service.cpp'
      - 'prototype/scripts/seer_h200_pair_worker_v1.py'
      - 'prototype/scripts/seer_h200_group_worker_v1.py'
      - 'prototype/tests/test_seer_h200_*'\n      - 'prototype/tests/*h200_windows_adaptive*v002.py'
      - '.github/workflows/verify-h200-native-pair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: standard-minimal
      - name: Test bridge protocol (no real H200 outcomes)
        run: python3 prototype/tests/test_seer_h200_bridge_v1.py
      - name: Test grouped bridge (synthetic input only)
        run: python3 prototype/tests/test_seer_h200_group_bridge_v1.py
      - name: Build portable native Seer service
        env:
          SEER_RNS_BACKEND: portable
          SEER_MARCH: x86-64
        run: bash prototype/scripts/build_engine_service.sh
      - name: Check pair output against legacy range output
        run: |
          python3 prototype/tests/test_seer_h200_native_smoke_v1.py \
            --service prototype/build/seer_engine_service \
            --data prototype/data
      - name: Publish isolated test executable and gate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csp-h200-native-pair-linux-pilot
          path: |
            prototype/build/seer_engine_service
            prototype/data/gates_100k_u16.bin
            prototype/data/gates_negative_100k_u16.bin
          retention-days: 1
          if-no-files-found: error

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-python
      - name: Verify Windows 8-thread lock collision handling and session-display API\n        shell: pwsh\n        run: python prototype/tests/test_h200_windows_adaptive_runtime_v002.py\n      - name: Build portable Windows native Seer service
        shell: msys2 {0}
        env:
          SEER_ARCH: amd64
          SEER_MARCH: x86-64
          SEER_RNS_BACKEND: portable
        run: |
          bash prototype/scripts/build_engine_service.sh
          test -f prototype/build/seer_engine_service.exe
      - name: Check Windows P/B/R native parity
        shell: msys2 {0}
        run: |
          /ucrt64/bin/python3.exe prototype/tests/test_seer_h200_native_smoke_v1.py \
            --service prototype/build/seer_engine_service.exe \
            --data prototype/data
      - name: Collect portable Windows DLL dependencies and gate data
        shell: msys2 {0}
        run: |
          set -euo pipefail
          out=prototype/build/h200-windows-portable
          mkdir -p "$out/build" "$out/data"
          cp prototype/build/seer_engine_service.exe "$out/build/"
          cp prototype/data/gates_100k_u16.bin prototype/data/gates_negative_100k_u16.bin "$out/data/"
          while read -r dll; do
            [[ -f "$dll" ]] || continue
            cp -n "$dll" "$out/build/"
          done < <(ldd prototype/build/seer_engine_service.exe | awk '$3 ~ /^\/ucrt64\/bin\// {print $3}' | sort -u)
          test -s "$out/build/seer_engine_service.exe"
          test -s "$out/data/gates_100k_u16.bin"
          test -s "$out/data/gates_negative_100k_u16.bin"
      - name: Test bundled Windows service without MSYS2 toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = (Resolve-Path "prototype/build/h200-windows-portable").Path
          $service = Join-Path $bundle "build/seer_engine_service.exe"
          $gateDir = Join-Path $bundle "data"
          $python = (Get-Command python).Source
          $win = $env:SystemRoot
          $env:PATH = "$(Split-Path $service);$win\System32;$win;$win\System32\Wbem"
          & $python prototype/tests/test_seer_h200_native_smoke_v1.py --service $service --data $gateDir
          if ($LASTEXITCODE -ne 0) { throw "Portable Windows Seer service failed outside MSYS2 PATH" }
      - name: Obtain uninstalled Python 3.13.3 embeddable runtime for offline research package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.python.org/ftp/python/3.13.3/python-3.13.3-embed-amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "python-3.13.3-embed-amd64.zip"
          $dest = "prototype/build/h200-embedded-python"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $exe = Join-Path $dest "python.exe"
          if (!(Test-Path $exe)) {throw "Python embeddable binary missing"}
          & $exe -c "import sys,json,hashlib; assert sys.version_info[:3] == (3,13,3); print(sys.version)"
          if ($LASTEXITCODE -ne 0) {throw "Python embeddable smoke test failed"}
          Get-FileHash -Algorithm SHA256 -LiteralPath $zip | Format-List
      - name: Upload uninstalled official Python runtime for manual H200 package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csp-h200-windows-python-embed-research-only
          path: prototype/build/h200-embedded-python/
          retention-days: 1
          if-no-files-found: error
      - name: Upload Windows pilot (not H200 outputs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csp-h200-native-group-windows-pilot
          path: prototype/build/h200-windows-portable/
          retention-days: 1
          if-no-files-found: error

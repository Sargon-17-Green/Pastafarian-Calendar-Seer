name: Repair flattened Stage 5 upload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-flattened-stage5-upload
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Stage 4 base and flattened Stage 5 files
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor 9a4f1c57fa055b1e02c296fa77a2eb12878ab5a1 HEAD

          # Active Stage 4 files must still be exactly as they were before the
          # flattened Stage 5 web upload.
          git diff --quiet 9a4f1c57fa055b1e02c296fa77a2eb12878ab5a1 -- \
            query/provider-precomputed.mjs \
            query/index.mjs \
            http/app.mjs \
            http/server.mjs \
            api/openapi.yaml \
            precompute/cache-lookup.mjs

          # These six Stage 5 files were flattened into the repository root.
          python - <<'PY'
          import hashlib, pathlib
          expected = {
              "API_EXACT_PROVIDER_STAGE5.md": "5eed3934485fad5cf8f8ca4c5d8485200f6f2be25710cbea39e84d0f0293f30d",
              "build_year_locator.sh": "10da52b294b5c0de56600b5dcf254151b21a6274d54a76acb26fbf45c523a1ae",
              "seer_year_locator.cpp": "2172d2b57df30bf2fb8b636910c4c0085872b2fa3ac34ee9781427203bc778a4",
              "exact-engine.mjs": "87c0535c7e8d83771018f416814c48929ae826d0d28d28ce33e67b5914d19c22",
              "provider-precomputed.mjs": "8ec99f1df7029f0a2ff7e832795ac5cca893e8fda7751537180fc9e4ca9fb1be",
              "provider-exact-fallback.test.mjs": "242ccee4ea85e38a9fca90e1d32349a89a7283d70d3ab441076d8bdd512ad2a7",
              "verify-stage5-exact-provider.yml": "2d276c1b7611c86bb2c90d54e00a80e38fb5fdcae9658d72b778d456b1934674",
              "README_STAGE5.md": "7730978c0ad6b1eb451c5ce4509c2d6ef5c38f941b1d1f69fc3349f6ac027d5c",
              ".github/workflows/verify-stage5-exact-provider.yml": "13818fabf4589e002a255909d6371355af0ac9e117672e7b94504db28356739e",
          }
          for rel, want in expected.items():
              p = pathlib.Path(rel)
              if not p.is_file():
                  raise SystemExit(f"missing expected Stage 5 file: {rel}")
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f"unexpected content for {rel}: {got} != {want}")
          print("flattened Stage 5 upload verified")
          PY

          # Correct Stage 5 destinations must not already contain partial copies.
          test ! -e query/exact-engine.mjs
          test ! -e query/test/provider-exact-fallback.test.mjs
          test ! -e prototype/scripts/build_year_locator.sh
          test ! -e prototype/src/seer_year_locator.cpp
          test ! -e docs/API_EXACT_PROVIDER_STAGE5.md

      - name: Restore Stage 5 repository paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs prototype/scripts prototype/src query/test
          cp API_EXACT_PROVIDER_STAGE5.md docs/API_EXACT_PROVIDER_STAGE5.md
          cp build_year_locator.sh prototype/scripts/build_year_locator.sh
          cp seer_year_locator.cpp prototype/src/seer_year_locator.cpp
          cp exact-engine.mjs query/exact-engine.mjs
          cp provider-precomputed.mjs query/provider-precomputed.mjs
          cp provider-exact-fallback.test.mjs query/test/provider-exact-fallback.test.mjs

          # Remove only the accidental root copies. README_STAGE5.md belongs at
          # repository root; the .github workflow already exists at its correct path.
          rm -f API_EXACT_PROVIDER_STAGE5.md
          rm -f build_year_locator.sh
          rm -f seer_year_locator.cpp
          rm -f exact-engine.mjs
          rm -f provider-precomputed.mjs
          rm -f provider-exact-fallback.test.mjs
          rm -f verify-stage5-exact-provider.yml

          # The first repair attempt exposed that the hosted runner needs Boost
          # headers installed explicitly for boost::multiprecision.
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/verify-stage5-exact-provider.yml')
          s = p.read_text(encoding='utf-8')
          old = 'sudo apt-get install -y g++ libgmp-dev'
          new = 'sudo apt-get install -y g++ libgmp-dev libboost-dev'
          if old not in s:
              raise SystemExit('expected dependency line not found in Stage 5 verifier')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Verify repaired Stage 5 hashes
        shell: python
        run: |
          import hashlib, pathlib
          expected = {
              "README_STAGE5.md": "7730978c0ad6b1eb451c5ce4509c2d6ef5c38f941b1d1f69fc3349f6ac027d5c",
              "docs/API_EXACT_PROVIDER_STAGE5.md": "5eed3934485fad5cf8f8ca4c5d8485200f6f2be25710cbea39e84d0f0293f30d",
              "prototype/scripts/build_year_locator.sh": "10da52b294b5c0de56600b5dcf254151b21a6274d54a76acb26fbf45c523a1ae",
              "prototype/src/seer_year_locator.cpp": "2172d2b57df30bf2fb8b636910c4c0085872b2fa3ac34ee9781427203bc778a4",
              "query/exact-engine.mjs": "87c0535c7e8d83771018f416814c48929ae826d0d28d28ce33e67b5914d19c22",
              "query/provider-precomputed.mjs": "8ec99f1df7029f0a2ff7e832795ac5cca893e8fda7751537180fc9e4ca9fb1be",
              "query/test/provider-exact-fallback.test.mjs": "242ccee4ea85e38a9fca90e1d32349a89a7283d70d3ab441076d8bdd512ad2a7",
              ".github/workflows/verify-stage5-exact-provider.yml": "2d276c1b7611c86bb2c90d54e00a80e38fb5fdcae9658d72b778d456b1934674",
          }
          for rel, want in expected.items():
              got = hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f"repaired hash mismatch for {rel}: {got} != {want}")
          print("Stage 5 repository paths verified")

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgmp-dev libboost-dev

      - name: Build exact engines
        shell: bash
        run: |
          set -euo pipefail
          bash prototype/scripts/build_year_batch.sh
          bash prototype/scripts/build_year_locator.sh

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check query/exact-engine.mjs
          node --check query/provider-precomputed.mjs
          node --check http/app.mjs
          node --check http/server.mjs

      - name: Run Node tests
        shell: bash
        run: |
          set -euo pipefail
          node --test precompute/test/*.test.mjs query/test/*.test.mjs http/test/*.test.mjs

      - name: Validate generated cache
        run: node precompute/validate-generated.mjs

      - name: Set up isolated API contract environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .contract-venv
          .contract-venv/bin/python -m pip install --disable-pip-version-check \
            "jsonschema>=4.18,<5" \
            "referencing>=0.30" \
            "jsonschema-specifications>=2023.3.6" \
            PyYAML

      - name: Run API contract tests
        run: .contract-venv/bin/python api/tests/test_contract.py

      - name: Exact fallback and full-year smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { queryDate, queryYear } from './query/index.mjs';

          const index = JSON.parse(await readFile('./generated/index.json', 'utf8'));
          const descriptor = index.caches[0];
          const calc = descriptor.calcJdn;
          const outsideCache = descriptor.targetStartJdn + descriptor.targetCount + 7;

          const date = await queryDate({
            calculation: { jdn: String(calc) },
            target: { jdn: String(outsideCache) },
            presentation: 'canonical',
          });
          if (date.targetDay.jdn !== String(outsideCache)) {
            throw new Error('exact fallback target mismatch');
          }

          const year = await queryYear('5000', {
            calculation: { jdn: String(calc) },
            presentation: 'canonical',
          });
          if (year.year.number !== '5000') throw new Error('year number mismatch');
          if (!Number.isInteger(year.year.lengthDays) || year.year.lengthDays < 252 || year.year.lengthDays > 5778) {
            throw new Error(`unexpected year length: ${year.year.lengthDays}`);
          }
          if (year.year.cutlets.length < 1 || year.year.months.length < 1) {
            throw new Error('year structure is incomplete');
          }

          console.log(JSON.stringify({
            exactTarget: date.targetDay.jdn,
            year: year.year.number,
            yearLength: year.year.lengthDays,
            cutlets: year.year.cutlets.length,
            months: year.year.months.length,
          }));
          NODE

      - name: Ensure clean repaired layout
        shell: bash
        run: |
          set -euo pipefail

          test -f query/exact-engine.mjs
          test -f query/provider-precomputed.mjs
          test -f query/test/provider-exact-fallback.test.mjs
          test -f prototype/scripts/build_year_locator.sh
          test -f prototype/src/seer_year_locator.cpp
          test -f docs/API_EXACT_PROVIDER_STAGE5.md
          test -f README_STAGE5.md
          test -f .github/workflows/verify-stage5-exact-provider.yml

          test ! -e exact-engine.mjs
          test ! -e provider-precomputed.mjs
          test ! -e provider-exact-fallback.test.mjs
          test ! -e build_year_locator.sh
          test ! -e seer_year_locator.cpp
          test ! -e API_EXACT_PROVIDER_STAGE5.md
          test ! -e verify-stage5-exact-provider.yml

          rm -rf .contract-venv prototype/build
          rm -f .github/workflows/repair-stage5-flattened-upload.yml
          git status --short

      - name: Commit repaired Stage 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pastafarian Seer repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit; Stage 5 layout is already repaired."
            exit 0
          fi
          git commit -m "Repair flattened Seer exact-provider Stage 5 upload"
          git push origin HEAD:main

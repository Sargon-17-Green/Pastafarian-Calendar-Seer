name: Repair Stage 4 web upload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-stage4-web-upload
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected misplaced Stage 4 package
        shell: bash
        run: |
          set -euo pipefail
          test -f payload/http/app.mjs
          test -f payload/http/server.mjs
          test -f payload/http/test/http-adapter.test.mjs
          test -f payload/http/test/repository-smoke.test.mjs
          test -f payload/docs/API_HTTP_STAGE4.md
          test -f payload/README_STAGE4.md
          test -f PAYLOAD_MANIFEST.json
          test -f UPDATE.ps1
          test -f RUN_UPDATE.cmd
          test -f README_PACKAGE.md
          test -f UPLOAD_SHA256SUMS.txt
          test ! -e http/app.mjs

      - name: Verify Stage 3 base fingerprints
        shell: python
        run: |
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path("PAYLOAD_MANIFEST.json").read_text())
          if manifest.get("stage") != 4:
              raise SystemExit(f"unexpected stage: {manifest.get('stage')!r}")
          if manifest.get("verifiedBaseHead") != "4091d4d9e419da02e7ec8d6940c8ba9f570a463a":
              raise SystemExit("unexpected verifiedBaseHead")
          for rel, expected in manifest["requiredBaseSha256"].items():
              p = pathlib.Path(rel)
              if not p.is_file():
                  raise SystemExit(f"required Stage 3 base file missing: {rel}")
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != expected:
                  raise SystemExit(f"Stage 3 base mismatch for {rel}: {got} != {expected}")
          print("Stage 3 base fingerprints verified")

      - name: Apply Stage 4 payload and restore repository files
        shell: bash
        run: |
          set -euo pipefail
          cp -a payload/. ./

          # SHA256SUMS.txt belongs to the repository. The web upload replaced it
          # with the package's own checksum file, so restore the Stage 3 copy.
          git show 4091d4d9e419da02e7ec8d6940c8ba9f570a463a:SHA256SUMS.txt > SHA256SUMS.txt

          # Package-only wrapper files must never live in the repository.
          rm -rf payload
          rm -f PAYLOAD_MANIFEST.json UPDATE.ps1 RUN_UPDATE.cmd
          rm -f README_PACKAGE.md UPLOAD_SHA256SUMS.txt

      - name: Verify installed Stage 4 payload hashes
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          manifest = json.loads(subprocess.check_output([
              "git", "show", "d6de08a64e698b01c58010adb7ce624439f62866:PAYLOAD_MANIFEST.json"
          ], text=True))
          for item in manifest["files"]:
              p = pathlib.Path(item["path"])
              if not p.is_file():
                  raise SystemExit(f"missing installed Stage 4 file: {p}")
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != item["sha256"]:
                  raise SystemExit(f"SHA256 mismatch for {p}: {got} != {item['sha256']}")
          print(f"verified {len(manifest['files'])} installed Stage 4 files")

      - name: Set up isolated Python contract environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .contract-venv
          .contract-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .contract-venv/bin/python -m pip install --disable-pip-version-check \
            "jsonschema>=4.18,<5" \
            "referencing>=0.30" \
            "jsonschema-specifications>=2023.3.6" \
            PyYAML

      - name: Syntax-check HTTP adapter
        shell: bash
        run: |
          set -euo pipefail
          node --check http/app.mjs
          node --check http/server.mjs

      - name: Run Node tests
        shell: bash
        run: |
          set -euo pipefail
          node --test precompute/test/*.test.mjs query/test/*.test.mjs http/test/*.test.mjs

      - name: Validate generated cache
        run: node precompute/validate-generated.mjs

      - name: Run API contract tests
        run: .contract-venv/bin/python api/tests/test_contract.py

      - name: HTTP repository smoke test
        shell: bash
        run: |
          set -euo pipefail
          node --test http/test/repository-smoke.test.mjs

      - name: Ensure only intended repository changes remain
        shell: bash
        run: |
          set -euo pipefail
          test -f http/app.mjs
          test -f http/server.mjs
          test -f http/test/http-adapter.test.mjs
          test -f http/test/repository-smoke.test.mjs
          test -f docs/API_HTTP_STAGE4.md
          test -f README_STAGE4.md

          test ! -e payload
          test ! -e PAYLOAD_MANIFEST.json
          test ! -e UPDATE.ps1
          test ! -e RUN_UPDATE.cmd
          test ! -e README_PACKAGE.md
          test ! -e UPLOAD_SHA256SUMS.txt

          # Stage 3 base files must still be exactly the verified Stage 3 files.
          python - <<'PY'
          import hashlib, pathlib
          expected = {
              "query/index.mjs": "e9657604f70264619faedbce04105ade4eb1ccc8a703dc647aaa6d618e7738f6",
              "api/openapi.yaml": "5155a0abdf4cb5daffaf59c4a03fa14b3be763e68c1eed71d245bbc1b6672044",
              "precompute/cache-lookup.mjs": "64570288bd4c66d616be4537a21bb07933493ac90fff6a1fad0a1c19abc9a004",
          }
          for rel, want in expected.items():
              got = hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f"base file changed unexpectedly: {rel}: {got} != {want}")
          PY

          # Test-only environment and this one-shot workflow must not remain.
          rm -rf .contract-venv
          rm -f .github/workflows/repair-stage4-upload.yml

          git status --short

      - name: Commit repaired Stage 4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pastafarian Seer repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit; repository is already repaired."
            exit 0
          fi
          git commit -m "Apply Seer HTTP API Stage 4 after web-upload repair"
          git push origin HEAD:main

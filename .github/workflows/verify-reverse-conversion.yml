name: Verify reverse conversion
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.mjs'
      - 'query/index.mjs'
      - 'query/cli.mjs'
      - 'query/provider-precomputed.mjs'
      - 'query/test/reverse.test.mjs'
      - 'query/test/repository-integration.test.mjs'
      - 'http/app.mjs'
      - 'http/test/http-adapter.test.mjs'
      - 'api/**'
      - 'deployment/test/reverse-native-smoke.test.mjs'
      - '.github/workflows/verify-reverse-conversion.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: full-venv-minimal
      - name: Reverse API contract environment
        uses: ./.github/actions/contract-environment
        with:
          venv-path: .reverse-contract-venv
          python-command: python3
      - name: Build exact runtime
        uses: ./.github/actions/native-build
        with:
          targets: runtime
      - name: Reverse query, HTTP, CLI and exact-provider verification
        env:
          SEER_REQUIRE_ENGINE_SERVICE: '1'
        run: |
          node --check query/index.mjs
          node --check query/cli.mjs
          node --check http/app.mjs
          node --test query/test/reverse.test.mjs query/test/repository-integration.test.mjs http/test/http-adapter.test.mjs deployment/test/reverse-native-smoke.test.mjs
      - name: API contract verification
        run: .reverse-contract-venv/bin/python api/tests/test_contract.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-boost
      - name: Export MSYS2 UCRT64 toolchain
        shell: msys2 {0}
        run: |
          echo "CXX=$(cygpath -w "$(command -v g++)")" >> "$GITHUB_ENV"
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Build exact Windows runtime
        shell: pwsh
        run: |
          node scripts/build-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows exact runtime build failed: $LASTEXITCODE" }
      - name: Reverse query, HTTP, CLI and exact-provider verification on Windows
        shell: pwsh
        env:
          SEER_REQUIRE_ENGINE_SERVICE: '1'
        run: |
          node --check query/index.mjs
          node --check query/cli.mjs
          node --check http/app.mjs
          node --test query/test/reverse.test.mjs query/test/repository-integration.test.mjs http/test/http-adapter.test.mjs deployment/test/reverse-native-smoke.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows reverse conversion verification failed: $LASTEXITCODE" }

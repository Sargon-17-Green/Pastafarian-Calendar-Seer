name: Seer Next isolated native year-cache experiment

on:
  push:
    branches: [research/seer-next-first-principles-2026-11-06]
    paths:
      - 'research/seer-next/**'
      - 'bench/next/**'
      - '.github/workflows/seer-next-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write  # research branch only: archive verified raw output; no deploy or release

concurrency:
  group: seer-next-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native-avx2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-setup
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax-check all research JavaScript before native compilation
        run: |
          set -euo pipefail
          find research/seer-next/scripts -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
      - uses: ./.github/actions/native-deps
        with:
          profile: standard-minimal
      - name: Build unchanged baseline
        env:
          SEER_RNS_BACKEND: avx2
          SEER_MARCH: x86-64
        run: bash prototype/scripts/build_engine_service.sh
      - name: Build isolated experimental candidate
        env:
          SEER_RNS_BACKEND: avx2
          SEER_MARCH: x86-64
        run: bash research/seer-next/scripts/build_candidate.sh
      - name: Build isolated hybrid day-plus-year cache candidate
        env:
          SEER_RNS_BACKEND: avx2
          SEER_MARCH: x86-64
        run: bash research/seer-next/scripts/build_hybrid.sh
      - name: Differential stress across calculation days and cache eviction
        run: |
          set -euo pipefail
          mkdir -p research/seer-next/results/working
          node research/seer-next/scripts/verify_candidate.mjs --output=research/seer-next/results/working/differential.json
          cat research/seer-next/results/working/differential.json
      - name: Compare full numeric records and warm/cumulative work
        run: |
          set -euo pipefail
          mkdir -p research/seer-next/results/working
          node research/seer-next/scripts/compare_candidate.mjs --repetitions=32 --output=research/seer-next/results/working/ab.json
          cat research/seer-next/results/working/ab.json
      - name: Verify hybrid cache eviction, small budgets and range correctness
        run: |
          set -euo pipefail
          node research/seer-next/scripts/verify_hybrid_eviction.mjs --output=research/seer-next/results/working/hybrid-eviction.json
          node -e "const x=require('./research/seer-next/results/working/hybrid-eviction.json');console.log('HYBRID_EVICTION',JSON.stringify({verdict:x.verdict,phases:x.phaseCount}));"
      - name: Build cold-stage instrumented hybrid (baseline core retained independently)
        env:
          SEER_RNS_BACKEND: avx2
          SEER_MARCH: x86-64
        run: bash research/seer-next/scripts/build_cold_probe.sh
      - name: Build independent canonical saved-sum oracle
        run: |
          set -euo pipefail
          g++ -O2 -std=c++20 -Iprototype/tools prototype/tools/canonical_vector_oracle.cpp -o research/seer-next/build/independent_canonical_oracle
      - name: Verify hybrid and original against independent canonical oracle
        run: |
          set -euo pipefail
          mkdir -p research/seer-next/results/working
          node research/seer-next/scripts/verify_independent_oracle.mjs --output=research/seer-next/results/working/oracle.json
          node -e "const x=require('./research/seer-next/results/working/oracle.json');console.log('INDEPENDENT_ORACLE_SUMMARY',JSON.stringify({caseCount:x.count,verdict:x.verdict,dayHits:x.hybridMemo.dayHits}));"
      - name: Validate exact second-day dynamic recurrence against baseline and independent oracle
        run: |
          set -euo pipefail
          node research/seer-next/scripts/verify_second_day_shortcut.mjs --output=research/seer-next/results/working/second-day-exact.json
          node -e "const x=require('./research/seer-next/results/working/second-day-exact.json');console.log('SECOND_DAY_EXACT',JSON.stringify({requests:x.requests,oracle:x.independentOracleRequests,ratio:x.totalRatio}));"
      - name: Capture exact cold-stage decomposition with one process per request
        run: |
          set -euo pipefail
          node research/seer-next/scripts/measure_cold_stages.mjs --trials=2 --output=research/seer-next/results/working/cold-stages.json
          node -e "const x=require('./research/seer-next/results/working/cold-stages.json');console.log('COLD_STAGE_SUMMARY',JSON.stringify({cases:x.resultCount,tests:x.trials}));"
      - name: Evaluate RNS and replay-thread cold-cost/memory tradeoffs
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_cold_rns_workers.mjs --trials=2 --output=research/seer-next/results/working/cold-rns-workers.json
          node -e "const x=require('./research/seer-next/results/working/cold-rns-workers.json');console.log('RNS_WORKERS',JSON.stringify({samples:x.results.length,policies:x.policies.length}));"
      - name: Differential A/B of shared prime-independent Pascal plan and per-pack construction
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_rns_shared_plan.mjs --trials=2 --output=research/seer-next/results/working/rns-shared-plan.json
          node -e "const x=require('./research/seer-next/results/working/rns-shared-plan.json');console.log('SHARED_RNS_PLAN',JSON.stringify({cases:x.results.length,ratio:x.ratio,fullParity:x.fullJsonParity}));"
      - name: Factorial scratch buffer reuse A/B with full parity, native HWM and pack phases
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_rns_fact_pool.mjs --trials=2 --output=research/seer-next/results/working/rns-fact-pool.json
          node -e "const x=require('./research/seer-next/results/working/rns-fact-pool.json');console.log('RNS_FACT_POOL',JSON.stringify({cases:x.results.length,ratio:x.ratio,fullParity:x.fullJsonParity,memorySamples:x.memorySnapshots.length}));"
      - name: Compare 3-8 RNS workers and replay-worker tradeoffs on independent cold processes
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_cold_rns_scaling.mjs --trials=2 --output=research/seer-next/results/working/rns-worker-scaling.json
          node -e "const x=require('./research/seer-next/results/working/rns-worker-scaling.json');console.log('RNS_WORKER_SCALING',JSON.stringify({comparisons:x.results.length,policies:x.policies.length,caseCount:x.samples.length}));"
      - name: Confirm cold 4-RNS worker scaling in six paired trials
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_cold_rns_confirm.mjs --trials=6 --output=research/seer-next/results/working/rns-four-confirm.json
          node -e "const x=require('./research/seer-next/results/working/rns-four-confirm.json');console.log('RNS4_CONFIRM',JSON.stringify({comparisons:x.results.length,policies:x.policies.length,trials:x.trials}));"
      - name: Verify experimental42 and older profiles with cross-year R/Y/D full JSON parity
        run: |
          set -euo pipefail
          node research/seer-next/scripts/verify_experimental4_profile.mjs --output=research/seer-next/results/working/experimental4-parity.json
          node -e "const x=require('./research/seer-next/results/working/experimental4-parity.json');if(!x.allPassed||x.profiles.length!==4||x.requests.length!==27)throw Error('Missing experimental42 parity evidence');console.log('RNS42_PROFILE_PARITY',JSON.stringify({profiles:x.profiles.length,queries:x.requests.length,passed:x.allPassed}));"
      - name: Cross-year exact cold profile comparison across 4999-5001
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_rns_cross_year.mjs --trials=3 --output=research/seer-next/results/working/rns-cross-year.json
          node -e "const x=require('./research/seer-next/results/working/rns-cross-year.json');console.log('RNS_CROSS_YEAR',JSON.stringify({comparisons:x.results.length,years:x.years,calcs:x.calculationDays}));"
      - name: Re-evaluate exact 4-worker replay with 1-4 threads across canonical years
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_rns_replay_sweep.mjs --trials=3 --output=research/seer-next/results/working/rns-replay-sweep.json
          node -e "const x=require('./research/seer-next/results/working/rns-replay-sweep.json');if(x.results.length!==180)throw Error('Incomplete RNS replay sweep');console.log('RNS_REPLAY_SWEEP',JSON.stringify({cases:x.results.length,years:x.years,policies:x.policies}));"
      - name: Sweep cold RNS superblock sizes with fixed four/two workers
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_cold_superblock_sweep.mjs --trials=2 --output=research/seer-next/results/working/cold-superblock-sweep.json
          node -e "const x=require('./research/seer-next/results/working/cold-superblock-sweep.json');if(x.results.length!==120||x.policies.length!==5||x.samples.length!==12||x.results.some(v=>!v.fullJsonParity)||x.results.some(v=>v.policy.rns!==4||v.policy.replay!==2))throw Error('Incomplete exact superblock sweep');console.log('COLD_SUPERBLOCK_SWEEP',JSON.stringify({cpu:x.cpu,results:x.results.length,policies:x.policies.map(p=>p.superblock)}));"
      - name: Compare failure-responsive adaptive superblock against fixed policies on held-out years
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_cold_adaptive_block.mjs --trials=3 --output=research/seer-next/results/working/cold-adaptive-block.json
          node -e "const x=require('./research/seer-next/results/working/cold-adaptive-block.json');if(x.results.length!==192||x.policies.length!==4||x.samples.length!==16||x.trials!==3||x.results.some(v=>!v.fullJsonParity)||x.results.some(v=>v.policy.rns!==4||v.policy.replay!==2)||x.results.filter(v=>v.policy.adaptive).length!==48||x.results.some(v=>v.adaptiveTrace.enabled!==Number(v.policy.adaptive)))throw Error('Incomplete adaptive RNS exact-holdout evidence');console.log('COLD_ADAPTIVE_BLOCK',JSON.stringify({cpu:x.cpu,rows:x.results.length,holdoutYears:x.years,policies:x.policies}));"
      - name: Compare cold RNS engine initialization reuse across repeated exact R requests
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_rns_engine_reuse.mjs --trials=2 --output=research/seer-next/results/working/rns-engine-reuse.json
          node -e "const x=require('./research/seer-next/results/working/rns-engine-reuse.json');if(x.contexts!==20||x.candidateNativeRReplies!==125||x.referenceNativeRReplies!==65||x.summary.length!==3||!x.fullParity||x.results.some(v=>!v.completeParity)||x.results.some(v=>v.rows.reuse.trace.map(t=>t.hit).join(',')!=='0,1,1')||x.results.some(v=>v.rows.control.trace.map(t=>t.hit).join(',')!=='0,0,0')||x.eviction.trace.map(t=>t.hit).join(',')!=='0,0,0')throw Error('Incomplete exact RNS engine reuse evidence');console.log('RNS_ENGINE_REUSE',JSON.stringify({cpu:x.cpu,rows:x.contexts,summary:x.summary.map(g=>({kind:g.kind,first:g.firstRTotalMs,second:g.secondRTotalMs,third:g.thirdRTotalMs,all:g.allThreeMs,vm:g.maxVmPeakKiB,rss:g.maxRssHighWaterKiB}))}));"
      - name: Compare two-slot bounded RNS initializer LRU against one-slot and original
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_rns_two_slot_lru.mjs --trials=2 --output=research/seer-next/results/working/rns-two-slot-lru.json
          node -e "const x=require('./research/seer-next/results/working/rns-two-slot-lru.json');if(!x.fullParity||x.contexts!==8||x.groups.length!==3||x.trialsData.length!==8||x.trialsData.some(v=>!v.fullParity)||x.trialsData.some(v=>v.rows.slots2.trace.map(q=>q.hit).join(',')!=='0,0,1,1')||x.trialsData.some(v=>v.rows.slots1.trace.map(q=>q.hit).join(',')!=='0,0,0,0')||x.eviction.trace.map(q=>q.hit).join(',')!=='0,0,0,0'||x.cappedEvidence.effectiveLimitBytes!==536870912||x.cappedEvidence.trace.map(q=>q.hit).join(',')!=='0,0,1')throw Error('Missing exact bounded LRU parity/counters/cap');console.log('RNS_TWO_SLOT',JSON.stringify({cpu:x.cpu,contexts:x.contexts,groups:x.groups,cap:x.cappedEvidence.memory}));"
      - name: Verify mixed R Y D exact wire parity and RNS initializer reuse in hybrid probe
        run: |
          set -euo pipefail
          node research/seer-next/scripts/verify_rns_mixed_wire.mjs --trials=2 --output=research/seer-next/results/working/rns-mixed-wire.json
          node -e "const x=require('./research/seer-next/results/working/rns-mixed-wire.json');if(!x.fullParity||x.contexts!==4||x.commandsPerContext!==18||x.primaryNativeReplies!==360||x.cappedNativeReplies!==36||x.groups.length!==5||x.results.some(r=>!r.fullParity)||x.results.some(r=>r.rows.probe2.trace.slice(0,4).map(t=>t.hit).join(',')!=='0,0,1,1')||x.cappedEvidence.effectiveLimitBytes!==536870912)throw Error('Incomplete mixed R/Y/D parity/memory evidence');console.log('RNS_MIXED_WIRE',JSON.stringify({cpu:x.cpu,requests:x.primaryNativeReplies,groups:x.groups.map(g=>({mode:g.mode,ms:g.totalMs,rss:g.maxVmHwmKiB,vm:g.maxVmPeakKiB,hits:g.totalInitHits}))}));"
      - name: Enforce and measure Linux virtual-address-space limit
        run: |
          set -euo pipefail
          node research/seer-next/scripts/verify_linux_as_limit.mjs --output=research/seer-next/results/working/linux-as-limit.json
          cat research/seer-next/results/working/linux-as-limit.json
      - name: Verify complete Y 4999-5001 exports against original Seer under 512MiB
        run: |
          set -euo pipefail
          node research/seer-next/scripts/verify_full_year_512.mjs --output=research/seer-next/results/working/full-year-512.json
          node -e "const x=require('./research/seer-next/results/working/full-year-512.json');if(x.fullYearComparisons!==6||!x.allUncappedFullRepliesEqual)throw Error('Missing full-year equivalence');console.log('FULL_YEAR_512',JSON.stringify({fullYearComparisons:x.fullYearComparisons,underCapSuccesses:x.underCapSuccesses}));"
      - name: Measure exact full-year Y cold/warm exports for latency and experimental42
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_full_year_warm_cold.mjs --trials=2 --output=research/seer-next/results/working/full-year-warm-cold.json
          node -e "const x=require('./research/seer-next/results/working/full-year-warm-cold.json');if(x.results.length!==12||!x.completeFullJsonParity)throw Error('Incomplete full-year benchmark');console.log('FULL_YEAR_WARM_COLD',JSON.stringify({cpu:x.cpu,rows:x.results.length,groups:x.groups.map(g=>({profile:g.profile,cold:g.coldTotalMs,warm:g.firstWarmTotalMs}))}));"
      - name: Verify opt-in direct-Y memo cache, evictions and 512MiB repeated full-year exports
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_y_export_direct_memo.mjs --trials=2 --output=research/seer-next/results/working/y-export-direct-memo.json
          node -e "const x=require('./research/seer-next/results/working/y-export-direct-memo.json');if(x.results.length!==12||x.interop.length!==6||!x.cappedEvidence.fullParity||x.cappedEvidence.effectiveLimitBytes!==536870912||!x.completeFullJsonParity)throw Error('Missing direct-Y memo checks');console.log('Y_MEMO_DIRECT',JSON.stringify({contexts:x.results.length,groups:x.groups.map(g=>({profile:g.profile,totalMs:g.allThreeTotalMs})),memo:x.interop.map(v=>({label:v.label,builds:v.memo.builds,hits:v.memo.hits}))}));"
      - name: Compare opt-in Y structure reuse with original direct-Y memo
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_y_struct_reuse.mjs --trials=2 --output=research/seer-next/results/working/y-struct-reuse.json
          node -e "const x=require('./research/seer-next/results/working/y-struct-reuse.json');if(x.contexts!==12||x.fullYearReplies!==108||x.interop.length!==6||x.summary.length!==3||!x.fullParity||!x.cappedEvidence.fullParity||x.cappedEvidence.effectiveLimitBytes!==536870912)throw Error('Incomplete structure-reuse proof');console.log('Y_STRUCT_REUSE',JSON.stringify({cpu:x.cpu,contexts:x.contexts,summary:x.summary.map(g=>({kind:g.kind,cold:g.coldTotalMs,warm:g.firstWarmTotalMs,all:g.allThreeTotalMs})),interop:x.interop.map(v=>v.label)}));"
      - name: Profile cold, repeat, memory and CPU policies with A/B parity
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_policies.mjs --trials=2 --output=research/seer-next/results/working/profile-matrix.json
          node -e "const x=require('./research/seer-next/results/working/profile-matrix.json'); console.log('PROFILE_SUMMARY',JSON.stringify({results:x.results.length,scenarios:x.workloads.length,policies:x.policies.length,trials:x.trials}));"
      - name: Profile hybrid against unchanged Seer using the same workload matrix
        env:
          SEER_NEXT_CANDIDATE_BIN: ${{ github.workspace }}/research/seer-next/build/seer_next_hybrid_engine_service
        run: |
          set -euo pipefail
          node research/seer-next/scripts/profile_policies.mjs --trials=1 --output=research/seer-next/results/working/profile-hybrid.json
          node -e "const x=require('./research/seer-next/results/working/profile-hybrid.json'); console.log('HYBRID_PROFILE_SUMMARY',JSON.stringify({results:x.results.length,scenarios:x.workloads.length,policies:x.policies.length,trials:x.trials}));"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seer-next-native-ab-linux-avx2
          path: |
            research/seer-next/results/working/ab.json
            research/seer-next/results/working/differential.json
            research/seer-next/results/working/profile-matrix.json
            research/seer-next/results/working/profile-hybrid.json
            research/seer-next/results/working/oracle.json
            research/seer-next/results/working/hybrid-eviction.json
            research/seer-next/results/working/cold-stages.json
            research/seer-next/results/working/cold-rns-workers.json
            research/seer-next/results/working/rns-shared-plan.json
            research/seer-next/results/working/rns-fact-pool.json
            research/seer-next/results/working/rns-worker-scaling.json
            research/seer-next/results/working/rns-four-confirm.json
            research/seer-next/results/working/experimental4-parity.json
            research/seer-next/results/working/rns-cross-year.json
            research/seer-next/results/working/rns-replay-sweep.json
            research/seer-next/results/working/cold-superblock-sweep.json
            research/seer-next/results/working/cold-adaptive-block.json
            research/seer-next/results/working/rns-engine-reuse.json
            research/seer-next/results/working/rns-two-slot-lru.json
            research/seer-next/results/working/rns-mixed-wire.json
            research/seer-next/results/working/full-year-512.json
            research/seer-next/results/working/full-year-warm-cold.json
            research/seer-next/results/working/y-export-direct-memo.json
            research/seer-next/results/working/y-struct-reuse.json
            research/seer-next/results/working/second-day-exact.json
            research/seer-next/results/working/linux-as-limit.json
          if-no-files-found: error
      - name: Archive raw experiment results in research branch without retriggering CI
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/seer-next/results/ci-${GITHUB_SHA:0:12}"
          mkdir -p "$DEST"
          cp research/seer-next/results/working/{ab.json,differential.json,profile-matrix.json,profile-hybrid.json,oracle.json,hybrid-eviction.json,cold-stages.json,linux-as-limit.json,cold-rns-workers.json,second-day-exact.json,rns-shared-plan.json,rns-fact-pool.json,rns-worker-scaling.json,rns-four-confirm.json,experimental4-parity.json,rns-cross-year.json,rns-replay-sweep.json,cold-superblock-sweep.json,cold-adaptive-block.json,rns-engine-reuse.json,rns-two-slot-lru.json,rns-mixed-wire.json,full-year-512.json,full-year-warm-cold.json,y-export-direct-memo.json,y-struct-reuse.json} "$DEST/"
          cat > "$DEST/README.md" <<EOF
          # Seer Next independent oracle, full-year and hybrid raw CI evidence

          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Source commit: ${GITHUB_SHA}
          Runner: ${RUNNER_OS} / ${RUNNER_ARCH}

          All results are raw exact-candidate comparison artifacts from this run; they are not global speed claims. See each JSON for metrics, CPU/RSS snapshots, independent canonical vector results and statistical sample counts.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git diff --cached --quiet && { echo "No new evidence to archive."; exit 0; }
          git commit -m "research(seer-next): archive CI evidence for ${GITHUB_SHA:0:12} [skip ci]"
          git push origin HEAD:refs/heads/research/seer-next-first-principles-2026-11-06

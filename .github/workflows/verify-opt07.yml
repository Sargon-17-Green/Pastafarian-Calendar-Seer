name: Verify OPT-07 transition-map research
on:
  workflow_dispatch:
  push:
    paths:
      - 'prototype/src/opt07_transition_research.cpp'
      - 'prototype/scripts/build_opt07_transition_research.sh'
      - 'docs/OPT07_TRANSITION_MAP_RESEARCH.md'
      - '.github/workflows/verify-opt07.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: standard
      - name: Build OPT-07 research tool and OPT-06 service
        run: |
          bash prototype/scripts/build_opt07_transition_research.sh
          bash prototype/scripts/build_engine_service.sh
      - name: Weighted transition composition, confluence and break-even
        shell: bash
        run: |
          set -euo pipefail
          CALC=2461303
          (
            cd prototype/data
            ../build/opt07_transition_research "$CALC" 384 500000
          ) | tee OPT07_RESEARCH.txt
          grep -qx 'composition=PASS' OPT07_RESEARCH.txt
          grep -qx 'decision=DO_NOT_ADOPT' OPT07_RESEARCH.txt
          awk -F= '/^cold_transition_calls_chain=/{a=$2}
                   /^cold_transition_calls_lift_min=/{b=$2}
                   END{exit !(a==b && a>0)}' OPT07_RESEARCH.txt
          awk -F= '/^chain_cells=/{a=$2}
                   /^lift_cells=/{b=$2}
                   END{exit !(b>a && a>0)}' OPT07_RESEARCH.txt
      - name: OPT-06 focused service tests remain green
        run: node --test query/test/engine-service.test.mjs
      - name: Full regressions
        run: node --test precompute/test/*.test.mjs query/test/*.test.mjs http/test/*.test.mjs
      - name: API contract environment
        uses: ./.github/actions/contract-environment
      - name: API contract tests
        run: .contract-venv/bin/python api/tests/test_contract.py

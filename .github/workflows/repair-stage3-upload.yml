name: Repair Stage 3 web upload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-stage3-web-upload
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected misplaced package
        shell: bash
        run: |
          set -euo pipefail
          test -f payload/query/index.mjs
          test -f payload/api/openapi.yaml
          test -f payload/precompute/cache-lookup.mjs
          test -f PAYLOAD_MANIFEST.json
          test -f UPDATE.ps1
          test -f RUN_UPDATE.cmd
          test ! -e query/index.mjs
          test ! -e api/openapi.yaml

      - name: Apply cumulative Stage 3 payload
        shell: bash
        run: |
          set -euo pipefail
          cp -a payload/. ./

          # Restore repository-owned root files accidentally overwritten by
          # uploading the package wrapper rather than running it.
          git show aea57d6be6711abab92b7b7db73d82729153fcec:README.md > README.md
          git show aea57d6be6711abab92b7b7db73d82729153fcec:SHA256SUMS.txt > SHA256SUMS.txt

          # Package-only wrapper files must never live in the repository.
          rm -rf payload
          rm -f PAYLOAD_MANIFEST.json UPDATE.ps1 RUN_UPDATE.cmd

      - name: Verify payload hashes
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          manifest = json.loads(subprocess.check_output([
              "git", "show", "6590a7fa4351bc90cd50e0044570e6bd2ba776bb:PAYLOAD_MANIFEST.json"
          ], text=True))
          for item in manifest["files"]:
              p = pathlib.Path(item["path"])
              if not p.is_file():
                  raise SystemExit(f"missing installed payload file: {p}")
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != item["sha256"]:
                  raise SystemExit(f"SHA256 mismatch for {p}: {got} != {item['sha256']}")
          print(f"verified {len(manifest['files'])} installed payload files")

      - name: Set up Python contract-test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML

      - name: Run Node tests
        shell: bash
        run: |
          set -euo pipefail
          node --check query/index.mjs
          node --check query/cli.mjs
          node --check query/provider-precomputed.mjs
          node --check query/day-boundary.mjs
          node --test precompute/test/*.test.mjs query/test/*.test.mjs

      - name: Validate generated cache
        run: node precompute/validate-generated.mjs

      - name: Run API contract tests
        run: python api/tests/test_contract.py

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          read -r calc target < <(python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('generated/index.json').read_text())
          desc = index['caches'][0]
          cache = json.loads((Path('generated') / desc['path']).read_text())
          print(desc['calcJdn'], cache['records'][0]['targetJdn'])
          PY
          )
          node query/cli.mjs date --calculation-jdn "$calc" --target-jdn "$target" --canonical

      - name: Ensure only intended repository changes remain
        shell: bash
        run: |
          set -euo pipefail
          test -f query/index.mjs
          test -f api/openapi.yaml
          test -f docs/API_QUERY_LAYER_STAGE3.md
          test "$(sha256sum precompute/cache-lookup.mjs | awk '{print $1}')" = "64570288bd4c66d616be4537a21bb07933493ac90fff6a1fad0a1c19abc9a004"
          test ! -e payload
          test ! -e PAYLOAD_MANIFEST.json
          test ! -e UPDATE.ps1
          test ! -e RUN_UPDATE.cmd

          # Remove this one-shot workflow from the resulting repository.
          rm -f .github/workflows/repair-stage3-upload.yml
          git status --short

      - name: Commit repaired Stage 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pastafarian Seer repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit; repository is already repaired."
            exit 0
          fi
          git commit -m "Apply Seer API/query Stage 3 after web-upload repair"
          git push origin HEAD:main

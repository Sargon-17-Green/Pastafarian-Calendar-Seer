name: Refresh rolling cache data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: rolling-cache-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Sargon-17-Green/Pastafarian-Calendar-Seer'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: ./.github/actions/node-setup
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Restore current cache-data snapshot
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          CACHE_DIR="$RUNNER_TEMP/rolling-cache"
          CACHE_ARCHIVE="$RUNNER_TEMP/cache-archive"
          mkdir -p "$CACHE_DIR/calc" "$CACHE_ARCHIVE"
          EXISTS=false
          if git ls-remote --exit-code --heads origin refs/heads/cache-data >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/cache-data:refs/remotes/origin/cache-data
            git archive refs/remotes/origin/cache-data | tar -x -C "$CACHE_ARCHIVE"
            if [[ -f "$CACHE_ARCHIVE/index.json" ]]; then
              cp "$CACHE_ARCHIVE/index.json" "$CACHE_DIR/index.json"
            fi
            if [[ -d "$CACHE_ARCHIVE/calc" ]]; then
              find "$CACHE_ARCHIVE/calc" -maxdepth 1 -type f -name '*.json' -exec cp {} "$CACHE_DIR/calc/" \;
            fi
            EXISTS=true
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "cache_dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Decide whether refresh is required
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node precompute/refresh-plan.mjs --cache-dir="${{ steps.restore.outputs.cache_dir }}" > "$RUNNER_TEMP/cache-plan.json"
          cat "$RUNNER_TEMP/cache-plan.json"
          REFRESH="$(node -e "const p=require(process.argv[1]);process.stdout.write(String(p.refreshRequired))" "$RUNNER_TEMP/cache-plan.json")"
          echo "refresh=$REFRESH" >> "$GITHUB_OUTPUT"
          {
            echo '### Rolling cache refresh plan'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/cache-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install native build dependencies
        if: steps.plan.outputs.refresh == 'true'
        uses: ./.github/actions/native-deps
        with:
          profile: standard-minimal
      - name: Build exact batch engine
        if: steps.plan.outputs.refresh == 'true'
        uses: ./.github/actions/native-build
        with:
          targets: year-batch

      - name: Generate and verify cache snapshot
        if: steps.plan.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${{ steps.restore.outputs.cache_dir }}"
          SOURCE_SHA="${{ steps.restore.outputs.source_sha }}"
          node precompute/generate-cache.mjs \
            --output-dir="$CACHE_DIR" \
            --source-commit="$SOURCE_SHA"
          node precompute/validate-generated.mjs \
            --generated-dir="$CACHE_DIR" \
            --expected-source-commit="$SOURCE_SHA"
          if find "$CACHE_DIR" -type f -iname 'HANDOFF_*' | grep -q .; then
            echo 'HANDOFF_* material must never enter rolling cache data' >&2
            exit 1
          fi

      - name: Publish verified snapshot to cache-data
        if: steps.plan.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${{ steps.restore.outputs.cache_dir }}"
          SOURCE_SHA="${{ steps.restore.outputs.source_sha }}"
          PUBLISH="$RUNNER_TEMP/cache-publish"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "${{ steps.restore.outputs.branch_exists }}" == 'true' ]]; then
            git worktree add --detach "$PUBLISH" refs/remotes/origin/cache-data
          else
            git worktree add --detach "$PUBLISH" "$SOURCE_SHA"
            (
              cd "$PUBLISH"
              git switch --orphan cache-data-bootstrap
              git rm -rf --ignore-unmatch .
            )
          fi

          (
            cd "$PUBLISH"
            git rm -rf --ignore-unmatch .
            mkdir -p calc
            cp "$CACHE_DIR/index.json" index.json
            cp "$CACHE_DIR"/calc/*.json calc/
            git add index.json calc
            if git diff --cached --quiet; then
              echo 'Verified cache snapshot is unchanged; nothing to publish.'
              exit 0
            fi
            ACTIVE="$(node -e "const x=require('./index.json');process.stdout.write(String(x.activeCalcJdn))")"
            git commit -m "cache: refresh rolling data for calc $ACTIVE"
            git push origin HEAD:refs/heads/cache-data
          )

      - name: No-op confirmation
        if: steps.plan.outputs.refresh != 'true'
        run: echo 'Existing cache-data snapshot is current and verified; no update required.'

name: Publish verified package to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Sargon-17-Green/Pastafarian-Calendar-Seer' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tagged release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Pin supported npm CLI
        run: npm install --global npm@11.19.0

      - name: Validate immutable release ref
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          EXPECTED_TAG="v${VERSION}"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head package verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for WORKFLOW in verify-stage6-deployment.yml verify-supply-chain.yml verify-release-preflight.yml; do
            ok=0
            for _ in $(seq 1 120); do
              RUNS="$(gh run list --workflow "$WORKFLOW" --commit "$GITHUB_SHA" --limit 50 --json headSha,status,conclusion)"
              if node --input-type=module - "$GITHUB_SHA" "$RUNS" <<'NODE'
          const [sha, raw] = process.argv.slice(2);
          const runs = JSON.parse(raw);
          process.exit(runs.some((run) =>
            run.headSha === sha &&
            run.status === 'completed' &&
            run.conclusion === 'success'
          ) ? 0 : 1);
          NODE
              then ok=1; break; fi
              sleep 15
            done
            test "$ok" -eq 1 || { echo "No successful exact-head run for $WORKFLOW at $GITHUB_SHA" >&2; exit 1; }
          done

      - name: Package self-test and cache validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run validate:cache
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack-dry-run.json"
          else
            npm publish --dry-run --json > "$RUNNER_TEMP/npm-publish-dry-run.json"
          fi

      - name: Build two clean byte-identical packages
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          A="$RUNNER_TEMP/pack-a"
          B="$RUNNER_TEMP/pack-b"
          OA="$RUNNER_TEMP/out-a"
          OB="$RUNNER_TEMP/out-b"
          git worktree add --detach "$A" "$GITHUB_SHA"
          git worktree add --detach "$B" "$GITHUB_SHA"
          mkdir -p "$OA" "$OB"
          (cd "$A" && npm pack --silent --pack-destination "$OA" >/dev/null)
          (cd "$B" && npm pack --silent --pack-destination "$OB" >/dev/null)
          TGZ="$OA/pastafarian-calendar-seer-$VERSION.tgz"
          TGZ_B="$OB/pastafarian-calendar-seer-$VERSION.tgz"
          test -f "$TGZ" && test -f "$TGZ_B"
          SHA="$(sha256sum "$TGZ" | awk '{print $1}')"
          SHA_B="$(sha256sum "$TGZ_B" | awk '{print $1}')"
          echo "pack A: $SHA"
          echo "pack B: $SHA_B"
          test "$SHA" = "$SHA_B"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify npm package boundary
        shell: bash
        run: |
          set -euo pipefail
          TGZ="${{ steps.pack.outputs.tgz }}"
          tar -tzf "$TGZ" > "$RUNNER_TEMP/npm-package-files.txt"
          for REQUIRED in package/index.mjs package/client/index.mjs package/query/cli.mjs package/http/server.mjs package/api/openapi.json package/scripts/package-selftest.mjs package/scripts/verify-release.mjs package/docs/SUPPLY_CHAIN.md; do
            grep -qx "$REQUIRED" "$RUNNER_TEMP/npm-package-files.txt"
          done
          if grep -Eiq '(^|/)HANDOFF_|^package/\.github/|^package/(deployment|examples)/|^package/api/(examples|tests)/|^package/(query|client|http|precompute)/test/' "$RUNNER_TEMP/npm-package-files.txt"; then
            echo 'repository-only material leaked into npm package' >&2
            exit 1
          fi

      - name: Detect an existing registry version
        id: registry_state
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "npm version already exists; entering verification-only resume mode"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with OIDC provenance
        if: steps.registry_state.outputs.published != 'true'
        shell: bash
        run: npm publish "${{ steps.pack.outputs.tgz }}" --access public --provenance

      - name: Verify registry bytes, SRI, and metadata
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          FOUND=''
          for _ in $(seq 1 120); do
            FOUND="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
            test "$FOUND" = "$VERSION" && break
            sleep 5
          done
          test "$FOUND" = "$VERSION"
          npm view "$NAME@$VERSION" dist --json > "$RUNNER_TEMP/npm-dist.json"
          cat "$RUNNER_TEMP/npm-dist.json"
          TARBALL="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.tarball)" "$RUNNER_TEMP/npm-dist.json")"
          INTEGRITY="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.integrity)" "$RUNNER_TEMP/npm-dist.json")"
          curl -fsSL "$TARBALL" -o "$RUNNER_TEMP/registry.tgz"
          REGISTRY_SHA="$(sha256sum "$RUNNER_TEMP/registry.tgz" | awk '{print $1}')"
          test "$REGISTRY_SHA" = "${{ steps.pack.outputs.sha256 }}"
          cmp --silent "${{ steps.pack.outputs.tgz }}" "$RUNNER_TEMP/registry.tgz" || {
            echo 'registry tarball differs byte-for-byte from deterministic tagged package' >&2
            exit 1
          }
          node --input-type=module - "$RUNNER_TEMP/registry.tgz" "$INTEGRITY" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const [file, expected] = process.argv.slice(2);
          const actual = `sha512-${createHash('sha512').update(await readFile(file)).digest('base64')}`;
          if (actual !== expected) throw new Error(`npm SRI mismatch: ${actual} != ${expected}`);
          NODE
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgmp-dev libboost-dev

      - name: Clean registry install and installed-package verification
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          CONSUMER="$RUNNER_TEMP/npm-consumer"
          mkdir -p "$CONSUMER"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install --ignore-scripts "$NAME@$VERSION"
          node --input-type=module <<'NODE'
          const rootApi = await import('pastafarian-calendar-seer');
          const clientApi = await import('pastafarian-calendar-seer/client');
          if (typeof rootApi.queryDate !== 'function') throw new Error('queryDate export missing');
          if (typeof clientApi.createSeerClient !== 'function') throw new Error('createSeerClient export missing');
          NODE
          node "$GITHUB_WORKSPACE/deployment/test/installed-bins.mjs" "$CONSUMER"
          npm explore "$NAME" -- npm run build:native
          npm explore "$NAME" -- npm test
          npm explore "$NAME" -- npm run validate:cache
          npm audit signatures --json --include-attestations > "$RUNNER_TEMP/npm-signatures.json"
          cat "$RUNNER_TEMP/npm-signatures.json"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/npm-signatures.json', 'utf8'));
          if (!Array.isArray(report.invalid) || report.invalid.length !== 0) {
            throw new Error(`invalid signatures/attestations: ${JSON.stringify(report.invalid)}`);
          }
          if (!Array.isArray(report.missing) || report.missing.length !== 0) {
            throw new Error(`missing signatures/attestations: ${JSON.stringify(report.missing)}`);
          }
          if (!Array.isArray(report.verified) || report.verified.length < 1) {
            throw new Error('expected at least one verified npm provenance attestation');
          }
          console.log(`verified npm attestations: ${report.verified.length}`);
          NODE

name: Verify API Stage 6 deployment package
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'index.mjs'
      - 'query/**'
      - 'client/**'
      - 'http/**'
      - 'api/**'
      - 'precompute/**'
      - 'prototype/src/**'
      - 'prototype/data/**'
      - 'prototype/scripts/build_year_*.sh'
      - 'prototype/scripts/build_engine_service.sh'
      - 'scripts/package-selftest.mjs'
      - 'scripts/build-runtime.mjs'
      - 'scripts/build-runtime.ps1'
      - 'scripts/build-runtime.sh'
      - 'deployment/test/**'
      - 'docs/DEPLOYMENT_STAGE6.md'
      - 'docs/LOCALIZATION.md'
      - 'README_STAGE6.md'
      - 'README.md'
      - 'ROADMAP.md'
      - '.github/workflows/verify-stage6-deployment.yml'
permissions:
  contents: read
jobs:
  verify_linux:
    name: Linux package and contract verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: standard
      - name: Package entry-point checks
        run: |
          node --check index.mjs
          node --check http/index.mjs
          node --check http/server.mjs
          node --check scripts/package-selftest.mjs
          node --check deployment/test/installed-bins.mjs
          node --check deployment/test/package-entrypoints.test.mjs
          node --test deployment/test/package-entrypoints.test.mjs
      - name: Pack runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seer-pack
          NAME="$(npm pack --pack-destination /tmp/seer-pack --silent)"
          TGZ="/tmp/seer-pack/$NAME"
          echo "SEER_TGZ=$TGZ" >> "$GITHUB_ENV"
          tar -tzf "$TGZ" | tee /tmp/seer-package-files.txt
          grep -qx 'package/index.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/http/index.mjs' /tmp/seer-package-files.txt

          grep -qx 'package/api/openapi.json' /tmp/seer-package-files.txt
          grep -qx 'package/api/openapi.yaml' /tmp/seer-package-files.txt
          grep -qx 'package/query/locales/catalog.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/query/locales/en.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/query/locales/he.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/docs/LOCALIZATION.md' /tmp/seer-package-files.txt
          find api/schemas -maxdepth 1 -type f -name '*.json' -printf 'package/%p\n' | sort > /tmp/seer-expected-schemas.txt
          grep -E '^package/api/schemas/[A-Za-z0-9.-]+\.json$' /tmp/seer-package-files.txt | sort > /tmp/seer-actual-schemas.txt
          diff -u /tmp/seer-expected-schemas.txt /tmp/seer-actual-schemas.txt
          grep -qx 'package/precompute/cache-lookup.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/precompute/lib/cache-format.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/precompute/vendor/pastafari-calendar-1.4.1/venus-day-boundary.js' /tmp/seer-package-files.txt
          if grep -Eq '^package/generated/|^package/api/(examples|tests)/|^package/precompute/(generate-cache|refresh-plan|validate-generated|query)\.mjs$|^package/precompute/lib/(cache-refresh|schedule)\.mjs$' /tmp/seer-package-files.txt; then
            echo 'verification/generation material leaked into npm package' >&2
            exit 1
          fi
          grep -qx 'package/prototype/data/gates_u16.bin' /tmp/seer-package-files.txt
          grep -qx 'package/prototype/data/gates_negative_u16.bin' /tmp/seer-package-files.txt
          grep -qx 'package/prototype/data/gates_100k_u16.bin' /tmp/seer-package-files.txt
          grep -qx 'package/prototype/data/gates_negative_100k_u16.bin' /tmp/seer-package-files.txt
          test "$(grep -c '^package/prototype/data/' /tmp/seer-package-files.txt)" -eq 4
          cat > /tmp/seer-expected-runtime-sources.txt <<'EOF'
          package/prototype/src/pastafarian_year_batch.cpp
          package/prototype/src/rns_primes.hpp
          package/prototype/src/rns_primes32.hpp
          package/prototype/src/sauce_fast127_v12.hpp
          package/prototype/src/short_selection_o1.hpp
          package/prototype/src/seer_calendar_core.cpp
          package/prototype/src/seer_calendar_core.hpp
          package/prototype/src/seer_engine_service.cpp
          package/prototype/src/seer_month_dp_internal.hpp
          package/prototype/src/seer_selection_core.hpp
          package/prototype/src/seer_weave_avx2.cpp
          package/prototype/src/seer_weave_core.hpp
          package/prototype/src/seer_weave_portable.cpp
          package/prototype/src/seer_year_core.cpp
          package/prototype/src/seer_year_core.hpp
          package/prototype/src/seer_year_locator.cpp
          package/prototype/src/seer_year_structure.cpp
          EOF
          sed -i 's/^          //' /tmp/seer-expected-runtime-sources.txt
          grep '^package/prototype/src/' /tmp/seer-package-files.txt | sort > /tmp/seer-actual-runtime-sources.txt
          sort -o /tmp/seer-expected-runtime-sources.txt /tmp/seer-expected-runtime-sources.txt
          diff -u /tmp/seer-expected-runtime-sources.txt /tmp/seer-actual-runtime-sources.txt
          grep -qx 'package/scripts/package-selftest.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/scripts/build-runtime.mjs' /tmp/seer-package-files.txt
          grep -qx 'package/scripts/build-runtime.ps1' /tmp/seer-package-files.txt
          grep -qx 'package/scripts/build-runtime.sh' /tmp/seer-package-files.txt
          if grep -Eiq '(^|/)HANDOFF_|^package/\.github/' /tmp/seer-package-files.txt; then
            echo 'repository-only material leaked into npm package' >&2
            exit 1
          fi
      - name: npm publish dry-run preflight
        shell: bash
        run: |
          set -euo pipefail
          npm publish --dry-run --json >/tmp/seer-publish.json 2>/tmp/seer-publish.err
          cat /tmp/seer-publish.err
          python - <<'PY'
          import json, re
          err=open('/tmp/seer-publish.err','r',encoding='utf-8',errors='replace').read()
          err=re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', err)
          assert 'npm auto-corrected some errors' not in err, err
          assert 'npm warn publish errors corrected:' not in err, err
          corrections=[]
          for line in err.splitlines():
              if 'npm warn publish ' not in line: continue
              msg=line.split('npm warn publish ',1)[1].strip()
              if msg.startswith('This command requires you to be logged in to '): continue
              corrections.append(msg)
          assert not corrections, corrections
          pkg=json.load(open('package.json',encoding='utf-8'))
          package_id=f"{pkg['name']}@{pkg['version']}"
          payload=json.load(open('/tmp/seer-publish.json',encoding='utf-8'))
          if isinstance(payload, dict) and payload.get('id') == package_id: x=payload
          elif isinstance(payload, dict) and pkg['name'] in payload: x=payload[pkg['name']]
          elif isinstance(payload, list): x=next((item for item in payload if item.get('id') == package_id), None)
          else: x=None
          assert x and x['id']==package_id, payload
          modes={f['path']:f['mode'] for f in x['files']}
          assert modes['query/cli.mjs'] & 0o111
          assert modes['http/server.mjs'] & 0o111
          PY
      - name: Install packed tarball into clean consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/seer-consumer
          mkdir -p /tmp/seer-consumer
          cd /tmp/seer-consumer
          npm init -y >/dev/null
          npm install --ignore-scripts "$SEER_TGZ"
          test -f node_modules/pastafarian-calendar-seer/package.json
          test -f node_modules/pastafarian-calendar-seer/api/schemas/date-response.schema.json
          test -f node_modules/pastafarian-calendar-seer/client/index.mjs
          cd node_modules/pastafarian-calendar-seer
          npm test
          npm run build:native
      - name: Installed command shims smoke
        shell: bash
        run: node deployment/test/installed-bins.mjs /tmp/seer-consumer
      - name: Packed application and HTTP persistent-service smoke
        shell: bash
        env:
          SEER_REQUIRE_ENGINE_SERVICE: '1'
          SEER_TEST_SERVICE_SPAWN_COUNTER_FILE: /tmp/seer-stage6-spawns.txt
        run: |
          set -euo pipefail
          cd /tmp/seer-consumer
          rm -f "$SEER_TEST_SERVICE_SPAWN_COUNTER_FILE"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const calculationJdn = 2461303;
          const targetJdn = 2461676;
          const queryApi = await import('pastafarian-calendar-seer');
          const httpApi = await import('pastafarian-calendar-seer/http');
          const request = (target) => ({
            calculation: { jdn: calculationJdn },
            target: { jdn: target },
            presentation: 'canonical',
          });

          const first = await queryApi.queryDate(request(targetJdn));
          const second = await queryApi.queryDate(request(targetJdn + 1));
          const localized = await queryApi.queryDate({
            calculation: { jdn: calculationJdn },
            target: { jdn: targetJdn },
            presentation: 'full',
            locale: 'he',
          });
          if (first.targetDay.jdn !== String(targetJdn)) throw new Error('packed query target mismatch');
          if (second.targetDay.jdn !== String(targetJdn + 1)) throw new Error('packed repeated query target mismatch');
          if (localized.locale !== 'he' || localized.targetDay.jdn !== first.targetDay.jdn) throw new Error('packed localized exact query mismatch');
          if (localized.pastafarianDate.year !== first.pastafarianDate.year ||
              localized.pastafarianDate.cutlet.canonicalIndex !== first.pastafarianDate.cutlet.canonicalIndex ||
              localized.pastafarianDate.cutlet.day !== first.pastafarianDate.cutlet.day ||
              localized.pastafarianDate.month.canonicalIndex !== first.pastafarianDate.month.canonicalIndex ||
              localized.pastafarianDate.month.day !== first.pastafarianDate.month.day) {
            throw new Error('packed localized exact query changed canonical coordinates');
          }
          const extended = await queryApi.queryDate({
            calculation: { jdn: '6732954' },
            target: { jdn: '6732955' },
            presentation: 'canonical',
          });
          if (extended.targetDay.jdn !== '6732955') throw new Error('packed extended-domain query mismatch');

          const server = await httpApi.listen({ host: '127.0.0.1', port: 0 });
          try {
            const port = server.address().port;
            const url = `http://127.0.0.1:${port}/v1/date?calculationJdn=${calculationJdn}&targetJdn=${targetJdn + 2}&presentation=canonical`;
            const response = await fetch(url);
            if (response.status !== 200) throw new Error(`packed HTTP status ${response.status}: ${await response.text()}`);
            const body = await response.json();
            if (body.targetDay.jdn !== String(targetJdn + 2)) throw new Error('packed HTTP target mismatch');
            const localizedResponse = await fetch(`http://127.0.0.1:${port}/v1/date?calculationJdn=${calculationJdn}&targetJdn=${targetJdn + 2}&locale=he`);
            if (localizedResponse.status !== 200) throw new Error(`packed localized HTTP status ${localizedResponse.status}: ${await localizedResponse.text()}`);
            const localizedBody = await localizedResponse.json();
            if (localizedBody.locale !== 'he' || localizedBody.targetDay.jdn !== body.targetDay.jdn) throw new Error('packed localized HTTP mismatch');
          } finally {
            await new Promise((resolve, reject) => server.close((error) => error ? reject(error) : resolve()));
          }

          const spawnLines = (await readFile(process.env.SEER_TEST_SERVICE_SPAWN_COUNTER_FILE, 'utf8'))
            .split(/\r?\n/).filter(Boolean);
          if (spawnLines.length !== 1) throw new Error(`expected one persistent service spawn, got ${spawnLines.length}`);
          console.log({ calculationJdn, targetJdn, persistentServiceSpawns: spawnLines.length });
          NODE
      - name: Build checkout native runtime for regressions
        run: npm run build:native
      - name: Full repository regressions
        run: node --test precompute/test/*.test.mjs query/test/*.test.mjs client/test/*.test.mjs http/test/*.test.mjs deployment/test/*.test.mjs
      - name: API contract environment
        uses: ./.github/actions/contract-environment
      - name: API contract tests
        run: .contract-venv/bin/python api/tests/test_contract.py
      - name: Runtime/schema differential corpus
        run: .contract-venv/bin/python api/tests/test_runtime_contract.py
      - name: Print runtime/schema failure fixture
        if: ${{ failure() && hashFiles('api/tests/runtime_contract_failure.json') != '' }}
        run: cat api/tests/runtime_contract_failure.json

  verify_windows:
    name: Windows native package verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-boost
      - name: Export MSYS2 UCRT64 toolchain
        shell: msys2 {0}
        run: |
          echo "CXX=$(cygpath -w "$(command -v g++)")" >> "$GITHUB_ENV"
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Cross-platform exact-engine fixture tests
        shell: pwsh
        run: |
          node --test query/test/provider-bulk-coalescing.test.mjs query/test/provider-exact-fallback.test.mjs query/test/year-structure-fastpath.test.mjs
      - name: Pack and install on native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packDir = Join-Path $env:RUNNER_TEMP 'seer-stage6-win-pack'
          $consumer = Join-Path $env:RUNNER_TEMP 'seer-stage6-win-consumer'
          New-Item -ItemType Directory -Force $packDir, $consumer | Out-Null
          $name = (npm pack --pack-destination $packDir --silent).Trim()
          $tgz = Join-Path $packDir $name
          Set-Location $consumer
          npm init -y | Out-Null
          npm install --ignore-scripts $tgz
          $packageRoot = Join-Path $consumer 'node_modules\pastafarian-calendar-seer'
          if (-not (Test-Path (Join-Path $packageRoot 'package.json'))) { throw 'installed package missing' }
          Set-Location $packageRoot
          npm test
          npm run build:native
          foreach ($bin in @('seer_year_batch.exe','seer_year_locator.exe','seer_year_structure.exe','seer_engine_service.exe')) {
            if (-not (Test-Path (Join-Path $packageRoot "prototype\build\$bin"))) { throw "missing $bin" }
          }
          "SEER_WIN_CONSUMER=$consumer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Installed Windows command shims smoke
        shell: pwsh
        run: |
          node deployment/test/installed-bins.mjs $env:SEER_WIN_CONSUMER
          if ($LASTEXITCODE -ne 0) { throw "Windows installed-bin smoke failed with exit code $LASTEXITCODE" }
      - name: Native Windows query and HTTP persistent-service smoke
        shell: pwsh
        env:
          SEER_REQUIRE_ENGINE_SERVICE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SEER_WIN_CONSUMER
          $env:SEER_TEST_SERVICE_SPAWN_COUNTER_FILE = Join-Path $env:RUNNER_TEMP 'seer-stage6-win-spawns.txt'
          Remove-Item -Force -ErrorAction SilentlyContinue $env:SEER_TEST_SERVICE_SPAWN_COUNTER_FILE
          @'
          import { readFile } from 'node:fs/promises';
          const calculationJdn = 2461303;
          const targetJdn = 2461676;
          const queryApi = await import('pastafarian-calendar-seer');
          const httpApi = await import('pastafarian-calendar-seer/http');
          const request = (target) => ({
            calculation: { jdn: calculationJdn },
            target: { jdn: target },
            presentation: 'canonical',
          });
          const first = await queryApi.queryDate(request(targetJdn));
          const second = await queryApi.queryDate(request(targetJdn + 1));
          const localized = await queryApi.queryDate({
            calculation: { jdn: calculationJdn },
            target: { jdn: targetJdn },
            presentation: 'full',
            locale: 'he',
          });
          if (first.targetDay.jdn !== String(targetJdn)) throw new Error('Windows packed query mismatch');
          if (second.targetDay.jdn !== String(targetJdn + 1)) throw new Error('Windows repeated query mismatch');
          if (localized.locale !== 'he' || localized.targetDay.jdn !== first.targetDay.jdn) throw new Error('Windows localized exact query mismatch');
          if (localized.pastafarianDate.year !== first.pastafarianDate.year ||
              localized.pastafarianDate.cutlet.canonicalIndex !== first.pastafarianDate.cutlet.canonicalIndex ||
              localized.pastafarianDate.cutlet.day !== first.pastafarianDate.cutlet.day ||
              localized.pastafarianDate.month.canonicalIndex !== first.pastafarianDate.month.canonicalIndex ||
              localized.pastafarianDate.month.day !== first.pastafarianDate.month.day) {
            throw new Error('Windows localized exact query changed canonical coordinates');
          }
          const extended = await queryApi.queryDate({
            calculation: { jdn: '6732954' },
            target: { jdn: '6732955' },
            presentation: 'canonical',
          });
          if (extended.targetDay.jdn !== '6732955') throw new Error('Windows extended-domain query mismatch');
          const server = await httpApi.listen({ host: '127.0.0.1', port: 0 });
          try {
            const port = server.address().port;
            const response = await fetch(`http://127.0.0.1:${port}/v1/date?calculationJdn=${calculationJdn}&targetJdn=${targetJdn + 2}&presentation=canonical`);
            if (response.status !== 200) throw new Error(`Windows packed HTTP status ${response.status}: ${await response.text()}`);
            const body = await response.json();
            if (body.targetDay.jdn !== String(targetJdn + 2)) throw new Error('Windows packed HTTP mismatch');
            const localizedResponse = await fetch(`http://127.0.0.1:${port}/v1/date?calculationJdn=${calculationJdn}&targetJdn=${targetJdn + 2}&locale=he`);
            if (localizedResponse.status !== 200) throw new Error(`Windows localized HTTP status ${localizedResponse.status}: ${await localizedResponse.text()}`);
            const localizedBody = await localizedResponse.json();
            if (localizedBody.locale !== 'he' || localizedBody.targetDay.jdn !== body.targetDay.jdn) throw new Error('Windows localized HTTP mismatch');
          } finally {
            await new Promise((resolve, reject) => server.close((error) => error ? reject(error) : resolve()));
          }
          const spawnLines = (await readFile(process.env.SEER_TEST_SERVICE_SPAWN_COUNTER_FILE, 'utf8'))
            .split(/\r?\n/).filter(Boolean);
          if (spawnLines.length !== 1) throw new Error(`expected one Windows persistent service spawn, got ${spawnLines.length}`);
          console.log({ calculationJdn, targetJdn, persistentServiceSpawns: spawnLines.length });
          '@ | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { throw "Windows packed runtime smoke failed with exit code $LASTEXITCODE" }

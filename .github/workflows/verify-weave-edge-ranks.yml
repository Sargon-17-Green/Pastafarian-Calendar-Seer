name: Verify difficult weave edge ranks
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototype/src/rns_micro8_avx2_32x8.cpp'
      - 'prototype/tools/weave_edge_rank_probe.cpp'
      - '.github/workflows/verify-weave-edge-ranks.yml'
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/_reusable-ci-job.yml
    with:
      runner: ubuntu-24.04
      timeout-minutes: 350
      native-profile: full-minimal
      command: |
        set -euo pipefail
        grep -qm1 -w avx2 /proc/cpuinfo
        mkdir -p prototype/build
        g++ -O3 -DNDEBUG -std=c++20 -fopenmp -pthread -march=native -Iprototype/src \
          prototype/tools/weave_edge_rank_probe.cpp -lgmpxx -lgmp \
          -o prototype/build/weave_edge_rank_probe
        prototype/build/weave_edge_rank_probe 3

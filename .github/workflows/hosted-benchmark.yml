name: Seer hosted benchmark

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Repetitions of the benchmark suite"
        required: true
        default: "1"
        type: string
      threads:
        description: "OpenMP threads"
        required: true
        default: "4"
        type: string
      superblock:
        description: "Superblock size"
        required: true
        default: "512"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record runner environment
        shell: bash
        run: |
          mkdir -p prototype/results
          {
            echo "utc=$(date -u -Iseconds)"
            echo "commit=$GITHUB_SHA"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo
            uname -a
            echo
            echo "nproc=$(nproc)"
            echo
            lscpu
            echo
            grep -m1 '^flags' /proc/cpuinfo || true
          } | tee prototype/results/runner-info.txt

      - name: Probe IFMA backend
        id: cpu
        shell: bash
        run: |
          mkdir -p prototype/build
          g++ -O2 -std=c++20 prototype/tools/cpu_probe.cpp -o prototype/build/cpu_probe
          set +e
          prototype/build/cpu_probe 2>&1 | tee prototype/results/cpu-probe.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "ifma=true" >> "$GITHUB_OUTPUT"
          else
            echo "ifma=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libboost-dev time

      - name: Build portable backend
        shell: bash
        env:
          SEER_PORTABLE_CXXFLAGS: -march=native
        run: |
          bash ./prototype/scripts/build_portable.sh

      - name: Portable exact RNS self-test
        shell: bash
        env:
          THREADS: ${{ inputs.threads }}
        run: |
          bash ./prototype/scripts/run_portable_selftest.sh 1

      - name: Portable calendar vector checks
        shell: bash
        env:
          THREADS: ${{ inputs.threads }}
          SB: ${{ inputs.superblock }}
        run: |
          bash ./prototype/scripts/check_portable_vectors.sh

      - name: Run portable benchmark
        shell: bash
        env:
          THREADS: ${{ inputs.threads }}
          SB: ${{ inputs.superblock }}
        run: |
          bash ./prototype/scripts/run_benchmark_portable.sh "${{ inputs.repetitions }}"

      - name: Build preserved IFMA baseline
        if: steps.cpu.outputs.ifma == 'true'
        shell: bash
        run: |
          cd prototype
          bash ./scripts/build.sh

      - name: Run preserved IFMA benchmark
        if: steps.cpu.outputs.ifma == 'true'
        shell: bash
        env:
          THREADS: ${{ inputs.threads }}
          SB: ${{ inputs.superblock }}
        run: |
          bash ./prototype/scripts/run_benchmark.sh "${{ inputs.repetitions }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Pastafarian Calendar Seer"
            echo
            echo "Portable backend was built and scheduled for exact self-test, vector checks, and benchmark."
            echo
            if [[ "${{ steps.cpu.outputs.ifma }}" == "true" ]]; then
              echo "The runner also exposes the complete IFMA feature set; the preserved baseline was scheduled too."
            else
              echo "The runner does not expose the complete IFMA feature set; the preserved IFMA baseline was not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seer-hosted-benchmark-${{ github.run_id }}
          path: prototype/results/
          if-no-files-found: error
          retention-days: 30

name: Verify container deployment

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'api/**'
      - 'client/**'
      - 'generated/**'
      - 'http/**'
      - 'precompute/**'
      - 'query/**'
      - 'prototype/data/**'
      - 'prototype/src/**'
      - 'prototype/scripts/build_*.sh'
      - 'scripts/build-runtime.sh'
      - 'scripts/build-runtime.mjs'
      - 'web/**'
      - 'docs/WEB_APPLICATION.md'
      - '.github/workflows/verify-container-deployment.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'api/**'
      - 'client/**'
      - 'generated/**'
      - 'http/**'
      - 'precompute/**'
      - 'query/**'
      - 'prototype/data/**'
      - 'prototype/src/**'
      - 'prototype/scripts/build_*.sh'
      - 'scripts/build-runtime.sh'
      - 'scripts/build-runtime.mjs'
      - 'web/**'
      - 'docs/WEB_APPLICATION.md'
      - '.github/workflows/verify-container-deployment.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Native container ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Build generic portable image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull             --build-arg TARGETARCH="${{ matrix.arch }}"             --tag "pastafarian-seer:ci-${{ matrix.arch }}" .

      - name: Inspect image contract
        shell: bash
        run: |
          set -euo pipefail
          image="pastafarian-seer:ci-${{ matrix.arch }}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "node"
          docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}' | grep -q '/v1/status'
          docker image inspect "$image" --format '{{json .Config.Env}}' | grep -q 'SEER_REQUIRE_ENGINE_SERVICE=1'
          docker image inspect "$image" --format '{{json .Config.Env}}' | grep -q 'SEER_WEB_ROOT=/opt/seer-web'
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "${{ matrix.arch }}"
      - name: HTTP, web and exact runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          image="pastafarian-seer:ci-${{ matrix.arch }}"
          docker run -d --name seer-container -p 18080:8080 "$image"
          cleanup() {
            docker logs seer-container || true
            docker rm -f seer-container >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/v1/status >/tmp/seer-status.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          test "$(docker exec seer-container id -u)" != "0"
          curl -fsS http://127.0.0.1:18080/web/ | grep -q 'Pastafarian Calendar Seer'
          curl -fsS http://127.0.0.1:18080/client/index.mjs | grep -q 'createSeerClient'

          curl -fsS             -H 'content-type: application/json'             -H 'accept: application/json'             --data '{"calculation":{"jdn":"-13334146"},"target":{"jdn":"-13337246"},"presentation":"canonical"}'             http://127.0.0.1:18080/v1/date >/tmp/seer-negative.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/seer-negative.json', encoding='utf-8'))
          assert x['calculationDay']['jdn'] == '-13334146', x
          assert x['targetDay']['jdn'] == '-13337246', x
          pf=x['pastafarianDate']
          req={
              'calculation': {'jdn': x['calculationDay']['jdn']},
              'pastafarianDate': {
                  'year': pf['year'],
                  'cutlet': {
                      'canonicalIndex': pf['cutlet']['canonicalIndex'],
                      'day': pf['cutlet']['day'],
                  },
                  'month': {
                      'canonicalIndex': pf['month']['canonicalIndex'],
                      'day': pf['month']['day'],
                  },
              },
              'presentation': 'canonical',
          }
          json.dump(req, open('/tmp/seer-reverse-request.json','w',encoding='utf-8'))
          open('/tmp/seer-year.txt','w',encoding='utf-8').write(str(pf['year']))
          print('negative exact query PASS', pf['year'])
          PY

          curl -fsS             -H 'content-type: application/json'             -H 'accept: application/json'             --data @/tmp/seer-reverse-request.json             http://127.0.0.1:18080/v1/reverse >/tmp/seer-reverse.json
          year="$(cat /tmp/seer-year.txt)"
          curl -fsS             "http://127.0.0.1:18080/v1/year/$year?calculationJdn=-13334146&presentation=canonical"             >/tmp/seer-year.json

          python - <<'PY'
          import json
          reverse=json.load(open('/tmp/seer-reverse.json', encoding='utf-8'))
          year=json.load(open('/tmp/seer-year.json', encoding='utf-8'))
          assert reverse['targetDay']['jdn'] == '-13337246', reverse
          expected=open('/tmp/seer-year.txt', encoding='utf-8').read().strip()
          assert year['year']['number'] == expected, year
          assert int(year['year']['endJdn']) - int(year['year']['startJdn']) + 1 == year['year']['lengthDays'], year
          print('container reverse/year PASS')
          PY

  multiarch-layout:
    name: Build multi-architecture OCI index
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 and arm64 OCI layout
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build             --platform linux/amd64,linux/arm64             --provenance=false             --output type=oci,dest=/tmp/seer-multiarch.oci .

      - name: Verify OCI manifest architectures
        shell: bash
        run: |
          python - <<'PY'
          import json, tarfile
          archive='/tmp/seer-multiarch.oci'

          with tarfile.open(archive) as tf:
              root=json.load(tf.extractfile('index.json'))
              seen=set()
              platforms=set()

              def load_descriptor(descriptor):
                  platform=descriptor.get('platform') or {}
                  os_name=platform.get('os')
                  arch=platform.get('architecture')
                  if os_name and arch:
                      platforms.add(f'{os_name}/{arch}')

                  digest=descriptor.get('digest', '')
                  if not digest.startswith('sha256:') or digest in seen:
                      return
                  seen.add(digest)
                  member='blobs/sha256/' + digest.split(':', 1)[1]
                  try:
                      payload=json.load(tf.extractfile(member))
                  except (KeyError, TypeError, json.JSONDecodeError):
                      return
                  for child in payload.get('manifests', []):
                      load_descriptor(child)

              for descriptor in root.get('manifests', []):
                  load_descriptor(descriptor)

          assert 'linux/amd64' in platforms, platforms
          assert 'linux/arm64' in platforms, platforms
          print('multi-architecture OCI index PASS', sorted(platforms))
          PY

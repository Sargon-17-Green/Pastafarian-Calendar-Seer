name: Verify Node compatibility

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    name: Node ${{ matrix.node }} compatibility
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    uses: ./.github/workflows/_reusable-ci-job.yml
    with:
      timeout-minutes: 15
      node-version: ${{ matrix.node }}
      command: node ci/verify-node-compat.mjs

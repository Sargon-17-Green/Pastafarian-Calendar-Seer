name: Verify ARM64 exact runtime

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname }}"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libgmp-dev libboost-dev
      - name: Audit portable backend source
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'immintrin|_mm_|__m(128|256|512)|cpuid|mavx2' prototype/src/seer_weave_portable.cpp; then
            echo "x86-only primitive leaked into portable backend" >&2
            exit 1
          fi
      - name: Build forced-portable exact runtime
        shell: bash
        env:
          SEER_ARCH: ${{ matrix.arch }}
          SEER_RNS_BACKEND: portable
        run: npm run build:native
      - name: Build independent canonical oracle
        shell: bash
        run: |
          g++ -O2 -std=c++20 -Iprototype/tools             prototype/tools/canonical_vector_oracle.cpp             -o prototype/build/canonical_vector_oracle
      - name: Positive and negative oracle parity
        run: python prototype/scripts/check_bidirectional_domain.py
      - name: Extended 100k gate-domain exactness
        shell: bash
        run: |
          set -euo pipefail
          g++ -O2 -std=c++20 -Iprototype/src prototype/tools/gate_domain_extension_probe.cpp -o prototype/build/gate_domain_extension_probe
          (cd prototype/data && ../build/gate_domain_extension_probe)
          python prototype/scripts/check_gate_domain_extension.py
          python prototype/scripts/check_gate_domain_differential.py
      - name: Persistent service, typed errors and reverse
        env:
          SEER_REQUIRE_ENGINE_SERVICE: '1'
        run: |
          node --test             query/test/engine-service.test.mjs             deployment/test/reverse-native-smoke.test.mjs
      - name: Produce canonical architecture snapshot
        shell: bash
        env:
          SEER_REQUIRE_ENGINE_SERVICE: '1'
          SEER_TEST_SERVICE_SPAWN_COUNTER_FILE: ${{ runner.temp }}/seer-arch-spawns.txt
        run: |
          set -euo pipefail
          rm -f "$SEER_TEST_SERVICE_SPAWN_COUNTER_FILE"
          node deployment/architecture-conformance.mjs             --output="${{ runner.temp }}/architecture-${{ matrix.arch }}.json"
      - name: Pack and install clean consumer
        shell: bash
        env:
          SEER_ARCH: ${{ matrix.arch }}
          SEER_RNS_BACKEND: portable
        run: |
          set -euo pipefail
          pack_dir="${{ runner.temp }}/seer-pack"
          consumer="${{ runner.temp }}/seer-consumer"
          mkdir -p "$pack_dir" "$consumer"
          tgz="$(npm pack --pack-destination "$pack_dir" --silent)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$pack_dir/$tgz"
          cd node_modules/pastafarian-calendar-seer
          npm test
          npm run build:native
          for bin in seer_year_batch seer_year_locator seer_year_structure seer_engine_service; do
            test -x "prototype/build/$bin"
          done
      - name: Upload architecture snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-${{ matrix.arch }}
          path: ${{ runner.temp }}/architecture-${{ matrix.arch }}.json
          if-no-files-found: error

  compare:
    name: Compare amd64 and ARM64 canonical outputs
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: architecture-*
          path: snapshots
      - name: Require exact canonical parity
        shell: bash
        run: |
          set -euo pipefail
          amd64="snapshots/architecture-amd64/architecture-amd64.json"
          arm64="snapshots/architecture-arm64/architecture-arm64.json"
          test -s "$amd64"
          test -s "$arm64"
          diff -u "$amd64" "$arm64"
          python - "$amd64" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1], encoding='utf-8'))
          assert x['foundationJdn'] == -13334246, x['foundationJdn']
          assert x['errors']['calculationBelowDomain'] == 'CALCULATION_OUT_OF_SUPPORTED_DOMAIN'
          assert x['errors']['targetBelowDomain'] == 'TARGET_OUT_OF_SUPPORTED_DOMAIN'
          assert x['errors']['reverseConflict'] == 'PASTAFARIAN_DATE_CONFLICT'
          assert x['reverse']['targetDay']['jdn'] == x['dates']['cross-foundation']['targetDay']['jdn']
          assert 'same-as-target-cross-foundation' in x['ranges']
          assert 'reverse-source-year' in x['years']
          print('amd64/arm64 canonical differential PASS')
          PY

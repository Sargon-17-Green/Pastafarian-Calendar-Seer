name: Seer replay-cache A-B-C

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Fresh-process repetitions per backend/case"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  replay-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record CPU
        shell: bash
        run: |
          mkdir -p prototype/results
          { date -u -Iseconds; echo "commit=$GITHUB_SHA"; lscpu; grep -m1 '^flags' /proc/cpuinfo || true; } | tee prototype/results/replay-cache-runner-info.txt
          grep -qm1 -w avx2 /proc/cpuinfo || { echo "AVX2 unavailable"; exit 3; }
      - name: Install dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: benchmark
      - name: Verify adopted v12 default first
        shell: bash
        run: bash ./prototype/scripts/check_v12_default_adoption.sh
      - name: Build baseline and replay-cache candidates
        shell: bash
        run: bash ./prototype/scripts/build_replay_cache_ab.sh
      - name: Exact validation
        shell: bash
        env:
          THREADS: "4"
          REPLAY_THREADS: "2"
          SB: "512"
        run: bash ./prototype/scripts/check_replay_cache_exact.sh
      - name: Benchmark baseline vs top2 vs all repeated caches
        shell: bash
        env:
          COUNT_THREADS: "4"
          REPLAY_THREADS: "2"
          SB: "512"
          COOLDOWN: "2"
        run: python3 ./prototype/scripts/run_replay_cache_ab.py "${{ inputs.repetitions || '3' }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seer-replay-cache-${{ github.run_id }}
          path: prototype/results/
          if-no-files-found: error
          retention-days: 30

name: Seer AVX2 adaptive Pascal-ladder A-B
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Cold interleaved repetitions
        required: false
        default: '7'
      cooldown:
        description: Seconds between cold processes
        required: false
        default: '2'
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Record CPU
        run: |
          mkdir -p prototype/results
          { date -u -Iseconds; echo "commit=$GITHUB_SHA"; lscpu; grep -m1 '^flags' /proc/cpuinfo || true; } | tee prototype/results/pascal-adaptive-runner-info.txt
          grep -qm1 -w avx2 /proc/cpuinfo || { echo "AVX2 unavailable"; exit 3; }
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libboost-dev time
      - name: Verify adopted v12 default
        run: bash ./prototype/scripts/check_v12_default_adoption.sh
      - name: Build A-B
        run: bash ./prototype/scripts/build_pascal_adaptive_ab.sh
      - name: Full-vector exactness
        env: { COUNT_THREADS: '4', REPLAY_THREADS: '2', SB: '512' }
        run: bash ./prototype/scripts/check_pascal_adaptive_vectors.sh
      - name: Cold interleaved benchmark
        env:
          COUNT_THREADS: '4'
          REPLAY_THREADS: '2'
          SB: '512'
          COOLDOWN: ${{ inputs.cooldown || '2' }}
        run: python3 ./prototype/scripts/run_pascal_adaptive_ab.py "${{ inputs.repetitions || '7' }}"
      - name: Heavy exact RNS self-test after timing
        run: ./prototype/build/pascal_adaptive_selftest 4 1 | tee prototype/results/pascal-adaptive-selftest.csv
      - uses: actions/upload-artifact@v4
        with:
          name: seer-pascal-adaptive-${{ github.run_id }}
          path: prototype/results/
          retention-days: 30

name: Verify full finite gate domain Phase C
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototype/data/gates_u16.bin'
      - 'prototype/data/gates_negative_u16.bin'
      - 'prototype/data/gates_100k_u16.bin'
      - 'prototype/data/gates_negative_100k_u16.bin'
      - 'prototype/src/year_fast_bench_v12.cpp'
      - 'prototype/src/pastafarian_year_batch.cpp'
      - 'prototype/tools/canonical_vector_oracle.cpp'
      - 'prototype/tools/full_domain_fast_probe.cpp'
      - 'prototype/tools/full_domain_reference_probe.cpp'
      - 'prototype/scripts/check_full_domain_walk.py'
      - '.github/workflows/verify-full-domain-walk-phase-c.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: full-minimal
      - name: Verify gate corpus digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum prototype/data/gates_u16.bin | awk '{print $1}')" = '2321775cd22a1156751fe506320d4afc47b27f391092645921df4b54d9ab49bb'
          test "$(sha256sum prototype/data/gates_negative_u16.bin | awk '{print $1}')" = '90a5cf809f19f62a87327b733d21572d739b83a383969765582cfb31cfb2b9ab'
          test "$(sha256sum prototype/data/gates_100k_u16.bin | awk '{print $1}')" = '4d45f05acc6eb4dee6e53757a8c1f94da2f3de0fe4d4659b0745f15e05b147a8'
          test "$(sha256sum prototype/data/gates_negative_100k_u16.bin | awk '{print $1}')" = '40bfbd7d76209c258fb7d4739f1ef9b10ac8bb38eb4f26690c1048aee0e4f884'
      - name: Build exact runtime and independent/full-domain probes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-runtime.sh
          mkdir -p prototype/build
          g++ -O2 -std=c++20 -Iprototype/tools prototype/tools/canonical_vector_oracle.cpp \
            -o prototype/build/canonical_vector_oracle
          g++ -O3 -DNDEBUG -std=c++20 -fopenmp -pthread -march=native -Iprototype/src \
            prototype/tools/full_domain_fast_probe.cpp -lgmpxx -lgmp \
            -o prototype/build/full_domain_fast_probe
          g++ -O2 -std=c++20 -Iprototype/tools \
            prototype/tools/full_domain_reference_probe.cpp \
            -o prototype/build/full_domain_reference_probe
      - name: Compare production walking with independent exact reference through both corpus edges
        run: python prototype/scripts/check_full_domain_walk.py
      - name: Positive and negative regression suite
        run: |
          node --test precompute/test/*.test.mjs query/test/*.test.mjs http/test/*.test.mjs deployment/test/*.test.mjs

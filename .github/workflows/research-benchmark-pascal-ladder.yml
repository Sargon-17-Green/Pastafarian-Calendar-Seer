name: Research - Seer AVX2 Pascal-ladder A-B
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Cold interleaved repetitions
        required: false
        default: '5'
      cooldown:
        description: Seconds between cold processes
        required: false
        default: '2'
permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record CPU
        run: |
          mkdir -p prototype/results
          { date -u -Iseconds; echo "commit=$GITHUB_SHA"; lscpu; grep -m1 '^flags' /proc/cpuinfo || true; } | tee prototype/results/pascal-ladder-runner-info.txt
          grep -qm1 -w avx2 /proc/cpuinfo || { echo "AVX2 unavailable"; exit 3; }
      - name: Install dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: benchmark
      - name: Verify adopted v12 default
        run: bash ./prototype/scripts/check_v12_default_adoption.sh
      - name: Build A-B
        run: bash ./prototype/scripts/build_pascal_ladder_ab.sh
      - name: Full-vector exactness
        env: { COUNT_THREADS: '4', REPLAY_THREADS: '2', SB: '512' }
        run: bash ./prototype/scripts/check_pascal_ladder_vectors.sh
      - name: Cold interleaved benchmark
        env:
          COUNT_THREADS: '4'
          REPLAY_THREADS: '2'
          SB: '512'
          COOLDOWN: ${{ inputs.cooldown || '2' }}
        run: python3 ./prototype/scripts/run_pascal_ladder_ab.py "${{ inputs.repetitions || '5' }}"
      - name: Heavy exact RNS self-test after timing
        run: ./prototype/build/pascal_ladder_selftest 4 1 | tee prototype/results/pascal-ladder-selftest.csv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seer-pascal-ladder-${{ github.run_id }}
          path: prototype/results/
          retention-days: 30

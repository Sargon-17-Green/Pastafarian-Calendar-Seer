name: Publish verified container to GHCR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: container-publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sargon-17-green/pastafarian-calendar-seer

jobs:
  publish:
    if: github.repository == 'Sargon-17-Green/Pastafarian-Calendar-Seer' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate immutable release ref
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require unified release-candidate verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-candidate-manifest.mjs \
            --sha "$GITHUB_SHA" \
            --download-dir "$RUNNER_TEMP/release-candidate-verification"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1

      - name: Resolve existing immutable version tags
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          DIGEST_VERSION="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
          DIGEST_VVERSION="$(docker buildx imagetools inspect "$IMAGE:v$VERSION" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
          if [[ -z "$DIGEST_VERSION" && -z "$DIGEST_VVERSION" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$DIGEST_VERSION" || -z "$DIGEST_VVERSION" || "$DIGEST_VERSION" != "$DIGEST_VVERSION" ]]; then
            echo "partial or divergent existing GHCR version tags; refusing overwrite" >&2
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST_VERSION" >> "$GITHUB_OUTPUT"
            echo "existing GHCR version tags agree at $DIGEST_VERSION"
          fi

      - name: Build and publish final runtime image
        if: steps.existing.outputs.present != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Resolve published image and platform digests
        id: image
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          DIGEST="$BUILT_DIGEST"
          if [[ -z "$DIGEST" ]]; then DIGEST="$EXISTING_DIGEST"; fi
          test -n "$DIGEST"

          RAW="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          mapfile -t PLATFORM_DIGESTS < <(node --input-type=module - "$RAW" <<'NODE'
          const raw = JSON.parse(process.argv[2]);
          for (const arch of ['amd64', 'arm64']) {
            const m = raw.manifests?.find((x) => x.platform?.os === 'linux' && x.platform?.architecture === arch);
            if (!m?.digest) throw new Error(`linux/${arch} manifest digest missing`);
            console.log(`${arch}=${m.digest}`);
          }
          NODE
          )

          declare -A P
          for line in "${PLATFORM_DIGESTS[@]}"; do
            P["${line%%=*}"]="${line#*=}"
          done
          test -n "${P[amd64]:-}" && test -n "${P[arm64]:-}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "amd64=${P[amd64]}" >> "$GITHUB_OUTPUT"
          echo "arm64=${P[arm64]}" >> "$GITHUB_OUTPUT"

          # Pull the native child and verify release identity labels. Both child images
          # are built by the same BuildKit invocation with identical OCI labels.
          docker pull --platform linux/amd64 "$IMAGE@${P[amd64]}"
          REVISION="$(docker image inspect "$IMAGE@${P[amd64]}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          VERSION_LABEL="$(docker image inspect "$IMAGE@${P[amd64]}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "$REVISION" = "$GITHUB_SHA"
          test "$VERSION_LABEL" = "$VERSION"

      - name: Attest published image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          subject-version: ${{ steps.meta.outputs.version }}
          push-to-registry: true

      - name: Scan amd64 image and retain HIGH/CRITICAL report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.amd64 }}
          version: v0.70.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-high-critical-amd64.json
          exit-code: '0'

      - name: Scan arm64 image and retain HIGH/CRITICAL report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.arm64 }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-high-critical-arm64.json
          exit-code: '0'
          skip-setup-trivy: true

      - name: Enforce amd64 unfixed-aware CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.amd64 }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Enforce arm64 unfixed-aware CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.arm64 }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Pull each platform by digest and run exact smoke
        shell: bash
        run: |
          set -euo pipefail

          smoke() {
            local arch="$1"
            local digest="$2"
            local ref="$IMAGE@$digest"
            local name="seer-release-$arch"
            local port="$3"

            docker pull --platform "linux/$arch" "$ref"
            docker run --platform "linux/$arch" -d --name "$name" -p "$port:8080" "$ref"
            cleanup_one() {
              docker logs "$name" || true
              docker rm -f "$name" >/dev/null 2>&1 || true
            }

            ready=0
            for _ in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/_health/live" > "/tmp/live-$arch.json"; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1
            python - "$arch" <<'PY'
          import json, sys
          arch=sys.argv[1]
          x=json.load(open(f'/tmp/live-{arch}.json', encoding='utf-8'))
          assert x == {'status': 'ok'}, x
          PY
            curl -fsS "http://127.0.0.1:$port/_health/ready" > "/tmp/ready-$arch.json"
            curl -fsS "http://127.0.0.1:$port/v1/status" > "/tmp/status-$arch.json"
            python - "$arch" <<'PY'
          import json, sys
          arch=sys.argv[1]
          ready=json.load(open(f'/tmp/ready-{arch}.json', encoding='utf-8'))
          status=json.load(open(f'/tmp/status-{arch}.json', encoding='utf-8'))
          assert ready == status, (ready, status)
          assert status['status'] in ('ok', 'degraded'), status
          assert set(status) == {'status'}, status
          PY
            test "$(docker exec "$name" id -u)" != '0'
            curl -fsS "http://127.0.0.1:$port/web/" | grep -q 'Pastafarian Calendar Seer'
            curl -fsS "http://127.0.0.1:$port/client/index.mjs" | grep -q 'createSeerClient'
            curl -fsS -H 'content-type: application/json'               --data '{"calculation":{"jdn":"-13334146"},"target":{"jdn":"-13337246"},"presentation":"canonical"}'               "http://127.0.0.1:$port/v1/date" > "/tmp/date-$arch.json"
            python - "$arch" <<'PY'
          import json, sys
          arch=sys.argv[1]
          x=json.load(open(f'/tmp/date-{arch}.json', encoding='utf-8'))
          assert x['calculationDay']['jdn'] == '-13334146', x
          assert x['targetDay']['jdn'] == '-13337246', x
          PY
            cleanup_one
          }

          smoke amd64 "${{ steps.image.outputs.amd64 }}" 18080
          smoke arm64 "${{ steps.image.outputs.arm64 }}" 18081

      - name: Record manifest and platform digests
        shell: bash
        run: |
          set -euo pipefail
          cat > container-release.json <<EOF
          {
            "version": "$VERSION",
            "commit": "$GITHUB_SHA",
            "image": "$IMAGE",
            "digest": "${{ steps.image.outputs.digest }}",
            "platforms": {
              "linux/amd64": "${{ steps.image.outputs.amd64 }}",
              "linux/arm64": "${{ steps.image.outputs.arm64 }}"
            }
          }
          EOF
          cat container-release.json

      - name: Upload scan and digest records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-release-${{ steps.meta.outputs.version }}
          path: |
            container-release.json
            trivy-high-critical-amd64.json
            trivy-high-critical-arm64.json
          if-no-files-found: error
          retention-days: 90

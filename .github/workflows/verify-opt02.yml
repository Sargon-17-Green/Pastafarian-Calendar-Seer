name: Verify OPT-02 bulk exact engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'query/index.mjs'
      - 'query/exact-engine.mjs'
      - 'query/provider-precomputed.mjs'
      - 'query/test/provider-bulk-coalescing.test.mjs'
      - 'query/test/bulk-query-concurrency.test.mjs'
      - 'docs/OPT02_BULK_EXACT.md'
      - '.github/workflows/verify-opt02.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native dependencies
        uses: ./.github/actions/native-deps
        with:
          profile: standard
      - name: Build exact engines
        uses: ./.github/actions/native-build
        with:
          targets: year-batch year-locator
      - name: Syntax checks
        run: |
          node --check query/index.mjs
          node --check query/exact-engine.mjs
          node --check query/provider-precomputed.mjs
      - name: Focused OPT-02 tests
        run: node --test query/test/provider-bulk-coalescing.test.mjs query/test/bulk-query-concurrency.test.mjs
      - name: Repository Node tests
        run: node --test precompute/test/*.test.mjs query/test/*.test.mjs http/test/*.test.mjs
      - name: API contract environment
        uses: ./.github/actions/contract-environment
      - name: API contract tests
        run: .contract-venv/bin/python api/tests/test_contract.py

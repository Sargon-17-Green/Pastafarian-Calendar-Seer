name: Native dependency profile
description: Install the canonical Linux native dependency set for CI.
inputs:
  profile:
    description: One of none, standard, standard-minimal, full-minimal, benchmark, boost, boost-minimal, full-venv-minimal.
    required: false
    default: standard-minimal
runs:
  using: composite
  steps:
    - name: Install native dependencies
      if: inputs.profile != 'none'
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        case "$PROFILE" in
          standard) packages=(g++ libgmp-dev libboost-dev); minimal=0 ;;
          standard-minimal) packages=(g++ libgmp-dev libboost-dev); minimal=1 ;;
          full-minimal) packages=(g++ libgmp-dev libboost-all-dev); minimal=1 ;;
          benchmark) packages=(libgmp-dev libboost-dev time); minimal=0 ;;
          boost) packages=(g++ libboost-dev); minimal=0 ;;
          boost-minimal) packages=(g++ libboost-dev); minimal=1 ;;
          full-venv-minimal) packages=(g++ libgmp-dev libboost-all-dev python3-venv); minimal=1 ;;
          *) echo "Unknown native dependency profile: $PROFILE" >&2; exit 2 ;;
        esac
        sudo apt-get update
        if [[ "$minimal" == 1 ]]; then
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
        else
          sudo apt-get install -y "${packages[@]}"
        fi

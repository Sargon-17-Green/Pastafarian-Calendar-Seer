openapi: 3.1.0
info:
  title: Pastafarian Calendar Seer API
  version: 1.0.0
  description: User-facing v1 contract. The calendar definition itself is normative; implementation details are intentionally
    absent from ordinary date responses. Reverse conversion is available at POST /v1/reverse for a complete canonical Pastafarian
    tuple.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: /
  description: Same-origin deployment
paths:
  /v1/now:
    get:
      summary: Current Pastafarian date
      description: Equivalent to /v1/date with default calculation instant and target t=c.
      parameters:
      - &id002
        name: observer
        in: query
        required: false
        description: Observer preset. v1 defines kisurra.
        schema:
          type: string
      - &id003
        name: longitude
        in: query
        required: false
        description: Observer longitude, degrees east-positive.
        schema:
          type: number
      - &id004
        name: latitude
        in: query
        required: false
        description: Ignored no-op compatibility field.
        schema: {}
      - &id005
        name: elevationMeters
        in: query
        required: false
        description: Ignored no-op compatibility field.
        schema: {}
      - &id006
        name: locale
        in: query
        required: false
        description: BCP 47 locale code. Missing defaults to en for full presentation; canonical presentation ignores locale.
          Discover supported codes at /v1/locales.
        schema:
          type: string
      - &id007
        name: presentation
        in: query
        required: false
        description: Output presentation mode.
        schema:
          type: string
          enum:
          - full
          - canonical
          default: full
      - &id008
        name: include
        in: query
        required: false
        description: Comma-separated include values.
        schema:
          type: string
      responses:
        '200':
          description: Current date
          content:
            application/json:
              schema:
                $ref: ./schemas/date-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': &id009
          description: Invalid or ambiguous request
          content: &id001
            application/json:
              schema:
                $ref: ./schemas/error-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '406': &id010
          description: Requested response representation or active locale is not acceptable
          content: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422': &id011
          description: Semantically invalid request
          content: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '503': &id012
          description: Seer cannot currently guarantee a correct answer
          content: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /v1/date:
    get:
      summary: Query a Pastafarian date
      parameters:
      - name: target
        in: query
        required: false
        description: Proleptic Gregorian CE date, YYYY-MM-DD.
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      - name: targetJdn
        in: query
        required: false
        description: Exact target JDN.
        schema:
          $ref: ./schemas/exact-integer.schema.json
      - name: offsetDays
        in: query
        required: false
        description: Target offset from calculation day.
        schema:
          $ref: ./schemas/exact-integer.schema.json
      - &id015
        name: calculationAt
        in: query
        required: false
        description: RFC 3339 instant with explicit timezone.
        schema:
          type: string
          format: date-time
      - &id016
        name: calculationJdn
        in: query
        required: false
        description: Explicit calculation-day JDN.
        schema:
          $ref: ./schemas/exact-integer.schema.json
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: Resolved date
          content:
            application/json:
              schema:
                $ref: ./schemas/date-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
        '422': *id011
        '503': *id012
    post:
      summary: Query a Pastafarian date with structured input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/date-request.schema.json
      responses:
        '200':
          description: Resolved date
          content:
            application/json:
              schema:
                $ref: ./schemas/date-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
        '422': *id011
        '503': *id012
        '415': &id014
          description: 'POST requests require Content-Type: application/json'
          content: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '413': &id013
          description: Request body or operation exceeds the configured limit
          content: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /v1/batch:
    post:
      summary: Resolve multiple independent date queries using one captured request instant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/batch-request.schema.json
      responses:
        '200':
          description: Per-item success/error results
          content:
            application/json:
              schema:
                $ref: ./schemas/batch-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '413': *id013
        '503': *id012
        '415': *id014
        '406': *id010
  /v1/range:
    post:
      summary: Resolve a deterministic sequence of target days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/range-request.schema.json
      responses:
        '200':
          description: Range results
          content:
            application/json:
              schema:
                $ref: ./schemas/range-response.schema.json
            application/x-ndjson:
              schema:
                type: string
            text/csv:
              schema:
                type: string
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
        '413':
          description: Range exceeds deployment limit
          content: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422': *id011
        '503': *id012
        '415': *id014
  /v1/year/{year}:
    get:
      summary: Get the Pastafarian structure of a year under a resolved calculation day
      parameters:
      - name: year
        in: path
        required: true
        schema:
          $ref: ./schemas/exact-integer.schema.json
      - *id015
      - *id016
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: Year structure
          content:
            application/json:
              schema:
                $ref: ./schemas/year-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
        '422': *id011
        '503': *id012
  /v1/reverse:
    post:
      summary: Reverse a complete Pastafarian date to its target day
      description: The calculation day remains independent. Supply year plus both canonical cutlet/day and month/day coordinates;
        both coordinate systems must identify the same day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/reverse-request.schema.json
      responses:
        '200':
          description: Resolved target day
          content:
            application/json:
              schema:
                $ref: ./schemas/date-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400':
          description: Invalid or incomplete request
          content:
            application/json:
              schema:
                $ref: ./schemas/error-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '406':
          description: Requested active locale is unsupported
          content:
            application/json:
              schema:
                $ref: ./schemas/error-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422':
          description: Pastafarian coordinates are invalid, absent from the year, inconsistent, or outside the supported domain
          content:
            application/json:
              schema:
                $ref: ./schemas/error-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '503':
          description: Seer cannot currently guarantee a correct answer
          content:
            application/json:
              schema:
                $ref: ./schemas/error-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '415': *id014
        '413': *id013
  /v1/calculation-day:
    get:
      summary: Resolve the active calculation day
      parameters:
      - name: at
        in: query
        required: false
        description: RFC 3339 instant with explicit timezone; defaults to request instant.
        schema:
          type: string
          format: date-time
      - *id002
      - *id003
      - *id004
      - *id005
      - *id008
      responses:
        '200':
          description: Calculation day
          content:
            application/json:
              schema:
                $ref: ./schemas/calculation-day-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
        '422': *id011
        '503': *id012
  /v1/locales:
    get:
      summary: List supported presentation locales
      responses:
        '200':
          description: Locales
          content:
            application/json:
              schema:
                $ref: ./schemas/locales-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
  /v1/meta:
    get:
      summary: Describe v1 capabilities
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: ./schemas/meta-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
  /v1/status:
    get:
      summary: Public service status
      responses:
        '200':
          description: Ready or degraded status
          content:
            application/json:
              schema:
                $ref: ./schemas/status-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: ./schemas/status-response.schema.json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '406': *id010
  /openapi.json:
    get:
      summary: OpenAPI contract in JSON
      responses:
        '200':
          description: OpenAPI 3.1 document
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
  /openapi.yaml:
    get:
      summary: OpenAPI contract in YAML
      responses:
        '200':
          description: OpenAPI 3.1 document
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
  /schemas/{schema}:
    get:
      summary: Referenced public JSON Schema
      parameters:
      - name: schema
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9.-]+\.schema\.json$
      responses:
        '200':
          description: JSON Schema document
          content:
            application/json:
              schema:
                type: object
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': *id009
        '404':
          description: Referenced public schema was not found
          content: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
x-seer-semantics:
  defaultObserver: kisurra
  defaultLocale: en
  defaultTarget: same-as-calculation-day
  requestInstant: captured-once-per-request
  boundaryInterval: '[start,end)'
  reverse:
    status: implemented
    endpoint: /v1/reverse
    requiresCompleteTuple: true
    coordinates:
    - year
    - cutlet.canonicalIndex
    - cutlet.day
    - month.canonicalIndex
    - month.day
  validationOrder:
  - parse
  - determine-mode
  - prune-irrelevant
  - drop-documented-noops
  - validate-selectors
  - validate-syntax
  - validate-semantics
  - resolve-defaults
  - calculate
  - present
x-locale-pack-schema:
  $ref: ./schemas/locale-pack.schema.json
components:
  headers:
    XRequestId:
      description: Opaque server-generated request correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    - "GitHub arm64 container CI"
    - "GitHub multi-architecture OCI index CI"

workstream_3_gates:
  - "Render Free Web Service can be created without a payment method"
  - "Frankfurt Docker deployment succeeds"
  - "Stable onrender.com HTTPS URL is confirmed"
  - "Runtime architecture is recorded"
  - "Representative warm exact latency and memory are measured"
  - "Four-request exact concurrency burst is measured"
  - "10k-range response is measured"
  - "Cold wake after 15 minutes idle is measured"
  - "Provider ingress/gateway timeout is measured and a shorter hosted application deadline is selected"
  - "A cheap non-calendar liveness endpoint is used for frequent health checks"
  - "Restart/redeploy and ephemeral-state loss are verified"
  - "No payment method or billing account is requested"
  - "Overload/rate-limit behavior is explicit before broad publicity"

fallback_trigger:
  - "Render requests a payment method"
  - "Docker build cannot complete on Free plan"
  - "Provider request timeout cannot satisfy the API contract"
  - "Measured Free-tier runtime is unstable or exceeds safe memory limits"


workstream_3_gates:
  - "Back4app build succeeds from the current Dockerfile without any paid feature"
  - "TARGETARCH behavior and actual runtime architecture are recorded"
  - "Provider ingress/gateway timeout is measured and a shorter hosted application deadline is selected"
  - "Representative exact, concurrency, and 10k-range benchmarks pass on-provider"
  - "A cheap non-calendar liveness endpoint is added and used for frequent health checks"
  - "No payment method or billing account is requested"
  - "Overload/rate-limit behavior is explicit before broad publicity"

fallback_trigger:
  - "Back4app requests a payment method"
  - "Docker build cannot complete on Free plan"
  - "Provider request timeout cannot satisfy the API contract"
  - "Measured Free-tier runtime is unstable or exceeds safe memory limits"
